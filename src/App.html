<script>
  // Núcleo de la interfaz: estado, llamadas al servidor, componentes comunes y la barra lateral.
  // Los permisos y cálculos los decide siempre el servidor; aquí solo se pinta lo que devuelve.
  const S = { token: null, u: null, cfg: {}, usuarios: [], tareas: [], hoy: '', vista: 'inicio', filtro: '', filtroMarca: '', verCanceladas: false };
  const VISTAS = {};

  const ROL_TXT = { admin: 'Administrador', coordinador: 'Coordinación', colaborador: 'Colaborador', practicante: 'Practicante' };
  const PRIO_TXT = { alta: 'Alta', media: 'Media', baja: 'Baja' };
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const MES_MIN = '2026-01';
  const MES_MAX = '2027-12';

  const ICONOS = {
    inicio: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z',
    calendario: 'M4 5h16v16H4zM4 9h16M8 3v4M16 3v4',
    tareas: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9',
    solicitudes: 'M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z',
    eventos: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
    horas: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
    contenido: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
    informes: 'M3 3v18h18M7 15l4-4 3 3 6-6',
    redes: 'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',
    asistencia: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 7v5l3 2M19 2v4M17 4h4',
    historico: 'M3 3h18v4H3zM5 7v13h14V7M10 11h4',
    notificaciones: 'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
    equipo: 'M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6',
    usuarios: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
    cuenta: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
    salir: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
    menu: 'M3 6h18M3 12h18M3 18h18'
  };

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icono = n => `<svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="${ICONOS[n]}"/></svg>`;
  const iniciales = n => esc(String(n || '?').split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase());
  const fmtFecha = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
  const fmtNum = (v, dec = 0) => Number(v || 0).toLocaleString('es-PE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const diaSemana = f => DIAS[(new Date(f + 'T12:00:00').getDay() + 6) % 7];
  const mesTexto = m => `${MESES[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`;
  const sumarMes = (m, n) => { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
  const sumarDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const esGestor = () => S.u && (S.u.rol === 'admin' || S.u.rol === 'coordinador');
  const esAdmin = () => S.u && S.u.rol === 'admin';
  const nombreDe = id => (S.usuarios.find(u => u.id === id) || {}).nombre || '—';
  const opciones = (lista, sel, vacio) => (vacio !== undefined ? `<option value="">${esc(vacio)}</option>` : '') +
    lista.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`; }).join('');
  const opcionesPersonas = (sel, vacio) => opciones(S.usuarios.map(u => [u.id, u.nombre + (u.area ? ' · ' + u.area : '')]), sel, vacio);

  function guardarToken(t) { try { t ? sessionStorage.setItem('vh_token', t) : sessionStorage.removeItem('vh_token'); } catch (e) {} }
  function leerToken() { try { return sessionStorage.getItem('vh_token'); } catch (e) { return null; } }

  function run(fn, ...args) {
    return new Promise((ok, falla) => google.script.run.withSuccessHandler(ok).withFailureHandler(falla)[fn](...args));
  }

  let pendientes = 0;
  function cargando(si) {
    pendientes += si ? 1 : -1;
    $('#carga').classList.toggle('activo', pendientes > 0);
  }

  async function api(fn, ...args) {
    cargando(true);
    try {
      return await run(fn, S.token, ...args);
    } catch (e) {
      const msg = (e && e.message) || String(e);
      if (msg.includes('SESION_EXPIRADA')) { cerrarSesion(true); throw new Error('Tu sesión expiró. Vuelve a ingresar.'); }
      throw new Error(msg);
    } finally {
      cargando(false);
    }
  }

  function aviso(texto, tipo) {
    const el = document.createElement('div');
    el.className = 'aviso' + (tipo === 'error' ? ' error' : '');
    el.textContent = texto;
    $('#avisos').appendChild(el);
    setTimeout(() => el.remove(), tipo === 'error' ? 6000 : 3500);
  }

  /**
   * Ventana modal. alEnviar(datos, form) se ejecuta al enviar; si es null, el botón solo cierra.
   * Devuelve { fondo, form, cerrar } para enganchar eventos del contenido.
   */
  function modal(titulo, cuerpo, alEnviar, textoBoton = 'Guardar', conCancelar = true, ancho) {
    const fondo = document.createElement('div');
    fondo.className = 'fondo';
    fondo.innerHTML = `<form class="modal${ancho ? ' ancho' : ''}" novalidate>
        <div class="modal-cab"><h3>${esc(titulo)}</h3><button type="button" class="btn-ico" data-cerrar aria-label="Cerrar">×</button></div>
        ${cuerpo}<p class="error"></p>
        <div class="pie">${conCancelar && alEnviar ? '<button type="button" class="btn fantasma" data-cerrar>Cancelar</button>' : ''}
          <button class="btn primario" type="submit">${esc(alEnviar ? textoBoton : 'Cerrar')}</button></div>
      </form>`;
    document.body.appendChild(fondo);
    const form = $('form', fondo);
    const cerrar = () => fondo.remove();
    fondo.addEventListener('click', e => { if (e.target === fondo || e.target.closest('[data-cerrar]')) cerrar(); });
    form.onsubmit = async e => {
      e.preventDefault();
      if (!alEnviar) return cerrar();
      if (!form.reportValidity()) return;
      const btn = $('[type=submit]', form);
      btn.disabled = true;
      try { await alEnviar(Object.fromEntries(new FormData(form)), form); cerrar(); }
      catch (err) { $('.error', form).textContent = err.message; btn.disabled = false; }
    };
    const primero = $('input:not([type=hidden]), select, textarea', form);
    if (primero && alEnviar) primero.focus();
    return { fondo, form, cerrar };
  }

  function confirmar(texto, boton) {
    return new Promise(ok => modal('Confirmar', `<p>${esc(texto)}</p>`, async () => ok(true), boton));
  }

  /** Barras horizontales simples: lista de { k, v }. */
  function barras(lista, opts = {}) {
    if (!lista.length) return `<p class="vacio">${esc(opts.vacio || 'Sin datos todavía')}</p>`;
    const max = Math.max(...lista.map(x => x.v), 1);
    return `<div class="barras">${lista.map(x => `
      <div class="barra-fila${x.clase ? ' ' + x.clase : ''}" title="${esc(x.k)}: ${esc(x.v)}">
        <span class="barra-k">${esc(x.k)}</span>
        <span class="barra-pista"><span class="barra-v" style="width:${Math.max(2, x.v / max * 100)}%"></span></span>
        <span class="barra-n">${esc(opts.fmt ? opts.fmt(x.v) : x.v)}${x.extra ? ' <small>' + esc(x.extra) + '</small>' : ''}</span>
      </div>`).join('')}</div>`;
  }

  /** Selector de mes ‹ Octubre 2026 › dentro de los límites del calendario. */
  function navMes(mes) {
    return `<div class="nav-mes">
      <button type="button" class="btn-ico" data-mes="-1" ${mes <= MES_MIN ? 'disabled' : ''} aria-label="Mes anterior">‹</button>
      <strong>${mesTexto(mes)}</strong>
      <button type="button" class="btn-ico" data-mes="1" ${mes >= MES_MAX ? 'disabled' : ''} aria-label="Mes siguiente">›</button>
    </div>`;
  }
  function enlazarNavMes(cont, mes, alCambiar) {
    $$('[data-mes]', cont).forEach(b => { b.onclick = () => alCambiar(sumarMes(mes, Number(b.dataset.mes))); });
  }

  /* ---------- Login ---------- */

  function vistaLogin(mensaje) {
    $('#app').innerHTML = `
      <main class="login">
        <form class="login-card" id="fLogin">
          <div class="marca"><span class="logo">VH</span><div><strong>MarketingVH</strong><small>Gestión de equipo</small></div></div>
          <label>Correo<input name="correo" type="email" autocomplete="username" required></label>
          <label>PIN (solo números)<input name="pin" type="password" inputmode="numeric" pattern="\\d{4,8}" maxlength="8"
            title="Tu PIN tiene entre 4 y 8 números" placeholder="••••••" autocomplete="current-password" required></label>
          <p class="error" id="loginError">${esc(mensaje || '')}</p>
          <button class="btn primario" type="submit">Ingresar</button>
        </form>
      </main>`;
    $('#fLogin').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const btn = $('button', e.target);
      btn.disabled = true;
      cargando(true);
      try {
        const r = await run('login', f.get('correo'), f.get('pin'));
        S.token = r.token;
        guardarToken(r.token);
        await iniciar();
      } catch (err) {
        $('#loginError').textContent = err.message;
        btn.disabled = false;
      } finally {
        cargando(false);
      }
    };
  }

  function cerrarSesion(expirada) {
    if (!expirada && S.token) run('logout', S.token).catch(() => {});
    S.token = null;
    S.u = null;
    guardarToken(null);
    vistaLogin(expirada ? 'Tu sesión expiró. Vuelve a ingresar.' : '');
  }

  async function iniciar() {
    const r = await api('getInicio');
    Object.assign(S, { u: r.usuario, cfg: r.cfg, usuarios: r.usuarios, tareas: r.tareas, hoy: r.hoy, filtro: '', noLeidas: r.notificaciones });
    vigilarNotificaciones();
    pintarApp();
  }

  async function recargarTareas() {
    const r = await api('listarTareas');
    S.tareas = r.tareas;
    S.hoy = r.hoy;
  }

  /* ---------- Barra lateral y navegación ---------- */

  function menu() {
    const r = S.u.rol;
    const g = esGestor();
    return [
      ['General', [['inicio', 'Inicio'], ['notificaciones', 'Notificaciones'], ['calendario', 'Calendario']]],
      ['Operación', [
        ['tareas', g ? 'Producción' : 'Mis tareas'],
        ['historico', 'Histórico de tareas'],
        ['solicitudes', 'Solicitudes'],
        ['eventos', 'Eventos y rotación'],
        (g || S.cfg.marcaHoras) && ['asistencia', g ? 'Horas y sobretiempo' : 'Mi horario']
      ]],
      ['Marketing', [
        ['contenido', 'Contenido y parrillas'],
        g && ['redes', 'Redes sociales'],
        g && ['informes', 'Informes']
      ]],
      ['Administración', [g && ['equipo', 'Equipo'], r === 'admin' && ['usuarios', 'Usuarios']]]
    ].map(([grupo, items]) => [grupo, items.filter(Boolean)]).filter(([, items]) => items.length);
  }

  function pintarApp() {
    const m = menu();
    const permitidas = m.flatMap(([, it]) => it.map(x => x[0])).concat('cuenta');
    if (!permitidas.includes(S.vista)) S.vista = 'inicio';
    $('#app').innerHTML = `
      <div class="layout">
        <aside class="lateral" id="lateral">
          <div class="marca"><span class="logo">VH</span><div><strong>MarketingVH</strong><small>VH Holding</small></div></div>
          <nav>${m.map(([grupo, items]) => `<p class="grupo">${grupo}</p>` +
            items.map(([k, t]) => `<button class="nav" data-vista="${k}">${icono(k)}<span>${t}</span>${k === 'notificaciones' ? '<b class="insignia" id="insigniaNav"></b>' : ''}</button>`).join('')).join('')}
          </nav>
          <div class="pie-lateral">
            <button class="nav" data-vista="cuenta">${icono('cuenta')}<span>${esc(S.u.nombre)}<small>${ROL_TXT[S.u.rol]}</small></span></button>
            <button class="nav" id="bSalir">${icono('salir')}<span>Salir</span></button>
          </div>
        </aside>
        <div class="velo" id="velo"></div>
        <div class="principal">
          <header class="top">
            <button class="btn-ico solo-movil" id="bMenu" aria-label="Menú">${icono('menu')}</button>
            <h1 id="tituloVista"></h1>
            <button class="btn-ico campana" id="bCampana" aria-label="Notificaciones">${icono('notificaciones')}<b class="insignia" id="insigniaTop"></b></button>
          </header>
          <main id="vista"></main>
        </div>
      </div>`;
    $('#lateral nav').onclick = $('.pie-lateral').onclick = e => {
      const b = e.target.closest('[data-vista]');
      if (b) irA(b.dataset.vista);
    };
    $('#bSalir').onclick = () => cerrarSesion(false);
    $('#bMenu').onclick = () => document.body.classList.add('menu-abierto');
    $('#velo').onclick = () => document.body.classList.remove('menu-abierto');
    $('#bCampana').onclick = () => irA('notificaciones');
    pintarInsignia();
    irA(S.vista);
  }

  /* ---------- Notificaciones: contador en la campana (se revisa cada minuto) ---------- */

  function pintarInsignia() {
    const n = S.noLeidas || 0;
    $$('#insigniaNav, #insigniaTop').forEach(el => { el.textContent = n > 99 ? '99+' : n || ''; el.hidden = !n; });
  }

  let relojNotif = null;
  function vigilarNotificaciones() {
    clearInterval(relojNotif);
    relojNotif = setInterval(async () => {
      if (!S.token || document.hidden) return;
      try {
        const n = await run('contarNotificaciones', S.token);
        if (n > (S.noLeidas || 0)) aviso('Tienes ' + n + ' notificación' + (n > 1 ? 'es' : '') + ' sin leer');
        S.noLeidas = n;
        pintarInsignia();
      } catch (e) { /* sin conexión: se reintenta en el siguiente minuto */ }
    }, 60000);
  }

  function irA(vista) {
    S.vista = vista;
    document.body.classList.remove('menu-abierto');
    $$('.lateral .nav').forEach(b => b.classList.toggle('activo', b.dataset.vista === vista));
    const v = VISTAS[vista];
    $('#tituloVista').textContent = typeof v.titulo === 'function' ? v.titulo() : v.titulo;
    $('#vista').innerHTML = '<p class="inicio">Cargando…</p>';
    $('#vista').onclick = $('#vista').onchange = null;
    Promise.resolve(v.pintar()).catch(e => {
      if (S.vista === vista) $('#vista').innerHTML = `<p class="inicio error">${esc(e.message)}</p>`;
    });
  }

  /** Vuelve a pintar la vista actual (tras guardar algo). */
  function repintar() { irA(S.vista); }

  /**
   * En celular las tablas se muestran como tarjetas (ver Estilos.html): cada celda necesita el título
   * de su columna en data-label. Se rellena solo cada vez que cambia el contenido.
   */
  function etiquetarTablas(raiz) {
    $$('.tabla-caja table:not(.matriz)', raiz).forEach(tabla => {
      const titulos = $$('thead th', tabla).map(th => th.textContent.trim());
      $$('tbody tr', tabla).forEach(tr => {
        Array.from(tr.children).forEach((td, i) => {
          if (td.dataset.label === undefined) td.dataset.label = td.colSpan > 1 ? '' : (titulos[i] || '');
        });
      });
    });
  }
  new MutationObserver(() => etiquetarTablas(document)).observe(document.body, { childList: true, subtree: true });

  function arrancar() {
    S.token = leerToken();
    if (!S.token) return vistaLogin();
    iniciar().catch(() => { if (S.token) cerrarSesion(true); });
  }
</script>
