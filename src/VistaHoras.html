<script>
  /* ---------- Horas y sobretiempo: marcación semanal de ingreso/salida + tabla del equipo ---------- */

  const DIAS_LARGOS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

  function rangoAsistencia(clave) {
    const hoy = S.hoy;
    const lunes = sumarDias(hoy, -((new Date(hoy + 'T12:00:00').getDay() + 6) % 7));
    const mes = hoy.slice(0, 7);
    const ant = sumarMes(mes, -1);
    const finMes = m => sumarDias(sumarMes(m, 1) + '-01', -1);
    return {
      semana: [lunes, hoy, 'Esta semana'],
      semanaPasada: [sumarDias(lunes, -7), sumarDias(lunes, -1), 'Semana pasada'],
      mes: [mes + '-01', hoy, 'Este mes'],
      mesPasado: [ant + '-01', finMes(ant), 'Mes pasado']
    }[clave];
  }

  VISTAS.asistencia = {
    titulo: () => esGestor() ? 'Horas y sobretiempo' : 'Mi horario',
    async pintar() {
      const partes = [pintarMiSemana()];
      if (esGestor()) partes.push(datosEquipoAsistencia());
      const [semana, equipo] = await Promise.all(partes);
      if (S.vista !== 'asistencia') return;
      $('#vista').innerHTML = htmlSemana(semana) + (equipo ? htmlEquipoAsistencia(equipo) : '');
      enlazarSemana(semana);
      if (equipo) enlazarEquipoAsistencia(equipo);
    }
  };

  /* --- Semana (marcación) --- */

  function pintarMiSemana() {
    return api('getMiSemana', S.lunesAsis || '', S.personaAsis || '');
  }

  function htmlSemana(d) {
    const otro = esGestor() && S.personaAsis && S.personaAsis !== S.u.id;
    if (!d.marca) {
      return `<section class="card">${esGestor() ? selectorPersonaSemana() : ''}<p class="vacio">${esc(d.mensaje)}</p></section>`;
    }
    const total = d.dias.reduce((s, x) => s + x.horas, 0);
    const meta = d.persona.practicante ? d.horasSemanaPracticante : null;
    return `<section class="card">
      <div class="cab-card">
        <h3>${otro ? 'Horario de ' + esc(d.persona.nombre) : 'Mi semana'}</h3>
        ${esGestor() ? `<div class="controles sin-salto">${selectorPersonaSemana()}
          <button type="button" class="btn-ico" data-sem="-1" aria-label="Semana anterior">‹</button>
          <button type="button" class="btn-ico" data-sem="1" aria-label="Semana siguiente">›</button></div>` : ''}
      </div>
      <p class="sub">Semana del ${fmtFecha(d.lunes)} al ${fmtFecha(sumarDias(d.lunes, 6))}.
        ${d.persona.practicante ? `Practicante: ${meta} h semanales en los días que coordines.` : 'Horario: L–V 9:00–18:30 · sáb 9:00–13:00.'}
        ${esGestor() ? '' : 'Al empezar una nueva semana la lista se reinicia.'}</p>
      <div class="semana">
        ${d.dias.map((x, i) => `<div class="dia-marca${x.fecha === S.hoy ? ' hoy' : ''}${!x.laborable && !d.persona.practicante ? ' libre' : ''}" data-fecha="${x.fecha}">
          <div class="dia-nombre"><b>${DIAS_LARGOS[i]} ${Number(x.fecha.slice(8))}</b>
            <small>${x.feriado ? 'Feriado' : (!x.laborable && !d.persona.practicante ? 'Día libre' : '')}${x.eventos.length ? ' 🎥 ' + esc(x.eventos.join(', ')) : ''}</small></div>
          <label>Ingreso<input type="time" data-k="entrada" value="${esc(x.entrada)}" ${x.editable ? '' : 'disabled'}></label>
          <label>Salida<input type="time" data-k="salida" value="${esc(x.salida)}" ${x.editable ? '' : 'disabled'}></label>
          <span class="dia-horas">${x.horas ? fmtNum(x.horas, 2) + ' h' : (x.entrada && !x.salida ? 'Falta salida' : '—')}</span>
        </div>`).join('')}
      </div>
      <div class="kpis mini">
        <div class="kpi"><span class="kpi-v">${fmtNum(total, 2)}${meta ? ` <small>/ ${meta} h</small>` : ''}</span><span class="kpi-k">Horas de la semana</span></div>
        <div class="kpi"><span class="kpi-v">${fmtNum(d.resumen.compensable || 0, 2)}</span><span class="kpi-k">Sobretiempo en eventos</span></div>
        ${esGestor() ? `<div class="kpi"><span class="kpi-v">${fmtNum(d.resumen.noCompensable || 0, 2)}</span><span class="kpi-k">Sobretiempo sin evento</span></div>` : ''}
      </div>
      <p class="sub">Se guarda solo al cambiar una hora.${d.persona.practicante ? ' El sobretiempo de practicantes es lo que pase de ' + meta + ' h en la semana.' : ' El sobretiempo es lo trabajado fuera del horario.'}</p>
    </section>`;
  }

  function selectorPersonaSemana() {
    const personas = S.usuarios.filter(u => u.marcaHoras);
    return `<select id="aPersonaSem" aria-label="Persona">${opciones(personas.map(u => [u.id, u.nombre]), S.personaAsis || S.u.id)}</select>`;
  }

  function enlazarSemana(d) {
    if ($('#aPersonaSem')) $('#aPersonaSem').onchange = e => { S.personaAsis = e.target.value; repintar(); };
    $$('[data-sem]').forEach(b => { b.onclick = () => { S.lunesAsis = sumarDias(d.lunes || S.hoy, 7 * Number(b.dataset.sem)); repintar(); }; });
    $$('.dia-marca input').forEach(inp => {
      inp.onchange = async () => {
        const fila = inp.closest('.dia-marca');
        const entrada = $('[data-k=entrada]', fila).value;
        const salida = $('[data-k=salida]', fila).value;
        if (!entrada && salida) return aviso('Primero marca la hora de ingreso.', 'error');
        try {
          await api('marcarAsistencia', { fecha: fila.dataset.fecha, entrada, salida, usuario_id: S.personaAsis || '' });
          aviso('Guardado');
          repintar();
        } catch (e) { aviso(e.message, 'error'); }
      };
    });
  }

  /* --- Equipo (coordinación/admin) --- */

  function datosEquipoAsistencia() {
    const clave = S.periodoAsis || 'semana';
    const [desde, hasta] = clave === 'rango' ? [S.desdeAsis || S.hoy.slice(0, 8) + '01', S.hastaAsis || S.hoy] : rangoAsistencia(clave);
    return api('getAsistenciaEquipo', desde, hasta, S.filtroAsis || '').then(d => Object.assign(d, { desde, hasta, clave }));
  }

  function htmlEquipoAsistencia(d) {
    const h = v => (v ? fmtNum(v, 2) : '—');
    return `
      <h2 class="seccion">Equipo</h2>
      <div class="toolbar">
        <div class="controles">
          <select id="aPeriodo" aria-label="Periodo">${opciones([['semana', 'Esta semana'], ['semanaPasada', 'Semana pasada'], ['mes', 'Este mes'], ['mesPasado', 'Mes pasado'], ['rango', 'Rango…']], d.clave)}</select>
          ${d.clave === 'rango' ? `<input type="date" id="aDesde" value="${d.desde}"><input type="date" id="aHasta" value="${d.hasta}">` : ''}
          <select id="aFiltro" aria-label="Persona">${opciones(d.personas.map(p => [p.usuario_id, p.nombre]), S.filtroAsis || '', 'Todo el equipo')}</select>
        </div>
        ${esAdmin() ? '<button class="btn" id="bCompensar">+ Registrar compensación</button>' : ''}
      </div>
      <p class="sub">Del ${fmtFecha(d.desde)} al ${fmtFecha(d.hasta)}. <b>Compensable</b>: sobretiempo en días en que la persona tenía un evento asignado.
        <b>No compensable</b>: sobretiempo sin evento ese día (revísalo: quizá se le pidió quedarse).</p>
      <section class="card sin-pad"><div class="cab-card pad"><h3>Resumen por persona</h3></div>
        <div class="tabla-caja plana"><table>
          <thead><tr><th>Persona</th><th class="num">Días</th><th class="num">Horas</th><th class="num">Compensable</th><th class="num">No compensable</th>
            <th class="num">Compensado (total)</th><th class="num">Saldo por compensar</th></tr></thead>
          <tbody>${d.personas.map(p => `<tr class="clic" data-p="${esc(p.usuario_id)}"><td><b>${esc(p.nombre)}</b>${p.practicante ? ' <span class="etiqueta">Practicante</span>' : ''}</td>
            <td class="num">${p.dias}</td><td class="num">${h(p.horas)}</td><td class="num"><span class="${p.compensable ? 'sube' : ''}">${h(p.compensable)}</span></td>
            <td class="num"><span class="${p.noCompensable ? 'baja' : ''}">${h(p.noCompensable)}</span></td>
            <td class="num">${h(p.compensado)}</td><td class="num"><b>${h(p.saldo)}</b></td></tr>`).join('')}</tbody>
        </table></div></section>
      ${d.semanasPracticantes.length ? `<section class="card sin-pad"><div class="cab-card pad"><h3>Practicantes por semana</h3></div>
        <p class="sub pad-x">Meta: ${d.horasSemanaPracticante} h semanales. Lo que pase es sobretiempo; es compensable hasta lo trabajado en días con evento.</p>
        <div class="tabla-caja plana"><table>
          <thead><tr><th>Semana</th><th>Persona</th><th class="num">Horas</th><th class="num">Compensable</th><th class="num">No compensable</th></tr></thead>
          <tbody>${d.semanasPracticantes.map(s => `<tr><td>${fmtFecha(s.lunes)} – ${fmtFecha(sumarDias(s.lunes, 6))}</td><td>${esc(s.nombre)}</td>
            <td class="num">${fmtNum(s.horas, 2)} / ${d.horasSemanaPracticante}</td><td class="num">${h(s.compensable)}</td><td class="num">${h(s.noCompensable)}</td></tr>`).join('')}</tbody>
        </table></div></section>` : ''}
      <section class="card sin-pad"><div class="cab-card pad"><h3>Historial de ingresos y salidas</h3></div>
        <div class="tabla-caja plana"><table>
          <thead><tr><th>Fecha</th><th>Persona</th><th>Ingreso</th><th>Salida</th><th class="num">Horas</th><th class="num">Compensable</th><th class="num">No compensable</th><th>Evento</th></tr></thead>
          <tbody>${d.filas.map(f => `<tr><td>${diaSemana(f.fecha)} ${fmtFecha(f.fecha)}</td><td>${esc(f.nombre)}</td>
            <td>${esc(f.entrada)}</td><td>${f.salida ? esc(f.salida) : '<span class="alerta">Sin salida</span>'}</td><td class="num">${h(f.horas)}</td>
            <td class="num">${f.practicante ? '<small>semanal</small>' : h(f.compensable)}</td><td class="num">${f.practicante ? '<small>semanal</small>' : h(f.noCompensable)}</td>
            <td class="ancho">${esc(f.eventos.join(', ')) || '—'}${f.nota ? `<small>${esc(f.nota)}</small>` : ''}</td></tr>`).join('')
            || '<tr><td colspan="8" class="vacio">Sin marcaciones en este periodo.</td></tr>'}</tbody>
        </table></div></section>
      ${d.compensaciones.length ? `<section class="card sin-pad"><div class="cab-card pad"><h3>Compensaciones registradas</h3></div>
        <div class="tabla-caja plana"><table><thead><tr><th>Fecha</th><th>Persona</th><th>Tipo</th><th class="num">Horas</th><th>Detalle</th></tr></thead>
        <tbody>${d.compensaciones.map(c => `<tr><td>${fmtFecha(c.fecha)}</td><td>${esc(c.persona)}</td><td>${esc(c.tipo)}</td>
          <td class="num">${fmtNum(c.horas, 2)}</td><td class="ancho">${esc(c.motivo)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  }

  function enlazarEquipoAsistencia(d) {
    $('#aPeriodo').onchange = e => { S.periodoAsis = e.target.value; repintar(); };
    $('#aFiltro').onchange = e => { S.filtroAsis = e.target.value; repintar(); };
    if ($('#aDesde')) {
      $('#aDesde').onchange = e => { S.desdeAsis = e.target.value; repintar(); };
      $('#aHasta').onchange = e => { S.hastaAsis = e.target.value; repintar(); };
    }
    if ($('#bCompensar')) $('#bCompensar').onclick = () => modal('Registrar compensación', `
      <div class="dos">
        <label>Persona<select name="usuario_id" required>${opciones(d.personas.map(p => [p.usuario_id, p.nombre]), '', 'Elegir…')}</select></label>
        <label>Fecha<input type="date" name="fecha" required value="${S.hoy}"></label>
      </div>
      <div class="dos">
        <label>Tipo<select name="tipo">${opciones(d.tiposCompensacion)}</select></label>
        <label>Horas compensadas<input type="number" name="horas" min="0.5" step="0.5" required></label>
      </div>
      <label>Detalle<input name="motivo" maxlength="500" placeholder="Ej.: día libre 15/10 coordinado con RR. HH."></label>`,
      async x => { await api('registrarCompensacion', x); aviso('Compensación registrada'); repintar(); }, 'Registrar');
    $$('tr[data-p]').forEach(tr => { tr.onclick = () => { S.filtroAsis = tr.dataset.p; S.personaAsis = tr.dataset.p; repintar(); }; });
  }
</script>
