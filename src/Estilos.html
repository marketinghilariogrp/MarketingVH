<style>
  :root {
    --fondo: #f4f5f7;
    --panel: #ffffff;
    --columna: #eceef2;
    --texto: #1f2430;
    --suave: #6b7280;
    --borde: #dfe2e8;
    --marca: #e4572e;
    --marca-txt: #ffffff;
    --ok: #15803d;
    --peligro: #b91c1c;
    --alta: #dc2626;
    --media: #d97706;
    --baja: #2563eb;
    --sombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
    --radio: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #111318;
      --panel: #1b1e25;
      --columna: #16181e;
      --texto: #e6e8ec;
      --suave: #9aa1ad;
      --borde: #2c303a;
      --ok: #22c55e;
      --peligro: #f87171;
      --alta: #f87171;
      --media: #fbbf24;
      --baja: #60a5fa;
      --sombra: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h2, h3, h4 { margin: 0; }
  .inicio { text-align: center; color: var(--suave); padding: 40px 16px; }

  /* Carga y avisos */
  #carga { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--marca); z-index: 50; transition: width .3s; }
  #carga.activo { width: 70%; transition: width 4s ease-out; }
  #avisos { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(420px, calc(100% - 32px)); }
  .aviso { background: var(--texto); color: var(--fondo); padding: 10px 14px; border-radius: 8px; box-shadow: var(--sombra); }
  .aviso.error { background: var(--peligro); color: #fff; }

  /* Botones y formularios */
  .btn { border: 1px solid var(--borde); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--suave); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primario { background: var(--marca); border-color: var(--marca); color: var(--marca-txt); font-weight: 600; }
  .btn.fantasma { background: transparent; border-color: transparent; color: var(--suave); }
  .btn.fantasma:hover { color: var(--texto); }
  .btn.mini { padding: 4px 10px; font-size: 12.5px; }
  .btn.ok { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .btn.peligro { color: var(--peligro); }
  label { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--marca); outline-offset: -1px; }
  label.check { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  label.check input { width: auto; }
  .error { color: var(--peligro); min-height: 1em; margin: 0; font-size: 13px; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { width: min(360px, 100%); background: var(--panel); border-radius: 14px; padding: 28px; box-shadow: var(--sombra); display: grid; gap: 14px; }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca small { display: block; color: var(--suave); font-weight: 400; }
  .logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--marca); color: #fff; font-weight: 800; letter-spacing: .5px; }

  /* Barra superior */
  .barra { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  .barra nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  .nav { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--suave); white-space: nowrap; }
  .nav:hover { color: var(--texto); }
  .nav.activo { background: var(--columna); color: var(--texto); font-weight: 600; }
  .yo { display: flex; align-items: center; gap: 8px; text-align: right; }
  .yo small { display: block; color: var(--suave); font-size: 12px; }

  /* Vistas */
  main#vista { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .controles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controles select { width: auto; min-width: 180px; }

  /* Kanban */
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
  .columna { background: var(--columna); border-radius: var(--radio); padding: 10px; display: grid; gap: 10px; }
  .columna h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); display: flex; justify-content: space-between; padding: 2px 4px; }
  .cuenta { background: var(--panel); border-radius: 10px; padding: 0 8px; color: var(--texto); }
  .vacio { color: var(--suave); text-align: center; margin: 8px 0; font-size: 13px; }
  .tarjeta { background: var(--panel); border-radius: 8px; padding: 12px; box-shadow: var(--sombra); display: grid; gap: 6px; border-left: 4px solid var(--borde); }
  .tarjeta.p-alta { border-left-color: var(--alta); }
  .tarjeta.p-media { border-left-color: var(--media); }
  .tarjeta.p-baja { border-left-color: var(--baja); }
  .tarjeta.vencida { outline: 1px solid var(--peligro); }
  .tarjeta h4 { font-size: 14.5px; overflow-wrap: anywhere; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; }
  .chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .chip.p-alta { color: var(--alta); }
  .chip.p-media { color: var(--media); }
  .chip.p-baja { color: var(--baja); }
  .fecha { color: var(--suave); }
  .vencida .fecha { color: var(--peligro); font-weight: 600; }
  .desc { margin: 0; color: var(--suave); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .nota { margin: 0; font-size: 12.5px; background: color-mix(in srgb, var(--media) 14%, transparent); border-radius: 6px; padding: 6px 8px; }
  .persona { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--suave); }
  .avatar { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--columna); color: var(--texto); font-size: 10px; font-weight: 700; }
  .acciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  /* Tablas */
  .tabla-caja { background: var(--panel); border-radius: var(--radio); box-shadow: var(--sombra); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.clic { cursor: pointer; }
  tr.clic:hover td { background: var(--columna); }
  tr.inactivo td { color: var(--suave); }
  .alerta { color: var(--peligro); font-weight: 700; }
  .etiqueta { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--columna); }

  /* Tarjeta simple (Mi cuenta) */
  .panel { background: var(--panel); border-radius: var(--radio); box-shadow: var(--sombra); padding: 20px; max-width: 420px; display: grid; gap: 12px; }

  /* Modal */
  .fondo { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; z-index: 40; }
  .modal { background: var(--panel); border-radius: 14px; padding: 22px; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; display: grid; gap: 12px; }
  .modal .pie { display: flex; justify-content: flex-end; gap: 8px; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pin { font-size: 32px; font-weight: 800; letter-spacing: 6px; text-align: center; margin: 6px 0; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .barra { padding: 10px 16px; }
    .barra nav { order: 3; flex-basis: 100%; }
    .yo { margin-left: auto; }
    main#vista { padding: 16px; }
    .dos { grid-template-columns: 1fr; }
    .controles select { min-width: 0; flex: 1; }
    .kanban { grid-auto-columns: 85%; }
  }
</style>
