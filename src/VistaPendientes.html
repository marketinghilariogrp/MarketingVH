<script>
  // Pendientes: checklist del día por prioridad (admin y coordinación). Ver Pendientes.gs para los permisos.
  const P = { lista: '', semana: '', dia: '', d: null };
  const ORDEN_PRIO = { alta: 0, media: 1, baja: 2 };
  const DIAS_LARGO = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const lunesDe = f => sumarDias(f, -((new Date(f + 'T12:00:00').getDay() + 6) % 7));
  const ordenPend = (a, b) => (a.hecho - b.hecho) || (ORDEN_PRIO[a.prioridad] - ORDEN_PRIO[b.prioridad]);
  const OPC_PRIO = [['alta', 'Alta'], ['media', 'Media'], ['baja', 'Baja']];
  const OPC_RECORDATORIO = [['', 'Sin recordatorio'], ['0', 'A la hora'], ['10', '10 min antes'], ['30', '30 min antes'],
    ['60', '1 hora antes'], ['120', '2 horas antes'], ['1440', '1 día antes']];

  VISTAS.pendientes = {
    titulo: 'Pendientes',
    async pintar() {
      if (!P.lista) P.lista = S.u.id;
      if (!P.dia) P.dia = S.hoy || new Date().toISOString().slice(0, 10);
      P.semana = lunesDe(P.dia);
      await cargarPendientes();
    }
  };

  async function cargarPendientes() {
    const d = await api('getPendientes', P.lista, P.semana, sumarDias(P.semana, 6));
    if (S.vista !== 'pendientes') return;
    P.d = d;
    pintarPendientes();
  }

  /** Formato permitido al mostrar la descripción (el servidor ya la limpia; esto es una segunda barrera). */
  const ETIQUETAS_NOTA = ['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'H2', 'H3', 'P', 'DIV', 'BR', 'UL', 'OL', 'LI', 'BLOCKQUOTE'];
  function htmlNota(html) {
    if (!html) return '';
    if (!/<\/?(b|strong|i|em|u|s|strike|h2|h3|p|div|br|ul|ol|li|blockquote)\b/i.test(html)) return esc(html).replace(/\n/g, '<br>');
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const limpiar = nodo => Array.from(nodo.childNodes).forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1) return n.remove();
      limpiar(n);
      if (!ETIQUETAS_NOTA.includes(n.tagName)) { n.replaceWith(...n.childNodes); return; }
      Array.from(n.attributes).forEach(a => n.removeAttribute(a.name));
    });
    const raiz = doc.body.firstChild;
    limpiar(raiz);
    return raiz.innerHTML;
  }
  const textoNota = html => { const d = document.createElement('div'); d.innerHTML = htmlNota(html); return d.textContent.trim(); };

  function itemPend(x) {
    return `<li class="p-${esc(x.prioridad)}${x.hecho ? ' hecho' : ''}${x.guardando ? ' guardando' : ''}" data-id="${esc(x.id)}">
      <input type="checkbox" data-acc="hecho" ${x.hecho ? 'checked' : ''} aria-label="Hecho">
      <div class="pend-texto" data-acc="abrir" title="Abrir nota"><span class="pend-titulo${x.hecho ? ' tachado' : ''}">${esc(x.titulo)}</span>
        ${x.prioridad !== 'media' ? `<span class="chip p-${esc(x.prioridad)}">${PRIO_TXT[x.prioridad]}</span>` : ''}
        ${textoNota(x.detalle) ? `<div class="pend-desc">${htmlNota(x.detalle)}</div>` : ''}
        ${x.de || x.en_calendario || x.viene_de ? `<small>${[x.viene_de && '↪ Pasó del ' + diaSemana(x.viene_de) + ' ' + fmtFecha(x.viene_de).slice(0, 5),
          x.de && 'De: ' + x.de, x.en_calendario && '📅 En el calendario'].filter(Boolean).map(esc).join(' · ')}</small>` : ''}
      </div>
      <div class="pend-acc">
        ${x.en_calendario ? '' : '<button type="button" class="btn-ico" data-acc="calendario" title="Pasar al calendario" aria-label="Pasar al calendario">📅</button>'}
        <button type="button" class="btn-ico" data-acc="abrir" title="Abrir nota" aria-label="Abrir nota">✎</button>
        <button type="button" class="btn-ico" data-acc="eliminar" title="Eliminar" aria-label="Eliminar">×</button>
      </div></li>`;
  }

  function pintarPendientes() {
    // Conserva lo que se está escribiendo: las respuestas del servidor repintan mientras se agregan más pendientes.
    const campo = $('#fPend [name=titulo]');
    const borrador = campo ? { valor: campo.value, foco: document.activeElement === campo, prioridad: $('#fPend [name=prioridad]').value } : null;
    pintarVistaPendientes();
    if (borrador) {
      const c = $('#fPend [name=titulo]');
      c.value = borrador.valor;
      $('#fPend [name=prioridad]').value = borrador.prioridad;
      if (borrador.foco) c.focus();
    }
  }

  function pintarVistaPendientes() {
    const d = P.d;
    const propia = P.lista === S.u.id;
    const nombreLista = (d.listas.find(l => l.id === P.lista) || {}).nombre;
    const delDia = d.items.filter(x => x.fecha === P.dia).sort(ordenPend);
    const hechos = delDia.filter(x => x.hecho).length;
    const fin = sumarDias(P.semana, 6);
    const dias = Array.from({ length: 7 }, (_, i) => sumarDias(P.semana, i));
    $('#vista').innerHTML = `
      <div class="toolbar">
        ${d.listas.length > 1 ? `<div class="pestanas">${d.listas.map(l => `<button class="pestana ${l.id === P.lista ? 'activo' : ''}" data-lista="${esc(l.id)}">${esc(l.nombre)}</button>`).join('')}</div>`
          : '<p class="sub">Lo que tienes que hacer cada día, ordenado por prioridad.</p>'}
        ${esAdmin() ? '' : '<button class="btn" id="bParaAdmin">Dejar pendiente al administrador</button>'}
      </div>
      <section class="card">
        <div class="toolbar">
          <div class="nav-mes">
            <button type="button" class="btn-ico" data-sem="-7" aria-label="Semana anterior">‹</button>
            <strong>${fmtFecha(P.semana).slice(0, 5)} – ${fmtFecha(fin)}</strong>
            <button type="button" class="btn-ico" data-sem="7" aria-label="Semana siguiente">›</button>
          </div>
          ${P.dia !== d.hoy ? '<button class="btn mini" id="bHoy">Ir a hoy</button>' : ''}
        </div>
        <div class="pend-semana">${dias.map((f, i) => {
          const del = d.items.filter(x => x.fecha === f);
          return `<button type="button" class="pend-dia${f === P.dia ? ' activo' : ''}${f === d.hoy ? ' hoy' : ''}" data-dia="${f}">
            <span>${DIAS[i]}</span><b>${f.slice(8)}</b><small>${del.length ? del.filter(x => x.hecho).length + '/' + del.length : '·'}</small></button>`;
        }).join('')}</div>
      </section>
      <section class="card">
        <h2 class="pend-cab">${P.dia === d.hoy ? 'Pendientes hoy' : DIAS_LARGO[(new Date(P.dia + 'T12:00:00').getDay() + 6) % 7] + ' ' + fmtFecha(P.dia).slice(0, 5)}</h2>
        <p class="sub">${!propia ? 'Lista de ' + esc(nombreLista) + ' · ' : ''}${delDia.length ? hechos + ' de ' + delDia.length + ' hechos · ' : ''}Toca un pendiente para escribir su descripción con formato.</p>
        <form class="pend-agregar" id="fPend">
          <input name="titulo" maxlength="500" placeholder="${propia ? '¿Qué tienes que hacer?' : 'Pendiente para ' + esc(nombreLista)}" autocomplete="off" required>
          <select name="prioridad" aria-label="Prioridad">${opciones(OPC_PRIO, 'media')}</select>
          <button class="btn primario">Agregar</button>
        </form>
        <ul class="lista pend-lista">${delDia.map(x => itemPend(x)).join('') || '<li class="vacio">Nada anotado para este día.</li>'}</ul>
      </section>
      ${d.enviados.length ? `<section class="card">
        <h3>Pendientes que dejaste al administrador</h3>
        <ul class="lista">${d.enviados.map(x => `<li>
          <span class="chip p-${esc(x.prioridad)}">${PRIO_TXT[x.prioridad]}</span>
          <div>${esc(x.titulo)}<small>Enviado el ${fmtFecha(x.enviado)} ${esc(x.enviado.slice(11, 16))}</small></div>
          <span class="${x.hecho ? 'sube' : 'sub'}">${x.hecho ? '✓ Hecho' : '✓ Agendado'}</span></li>`).join('')}</ul>
      </section>` : ''}`;

    $('#fPend').onsubmit = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (!f.titulo.trim()) return;
      // Aparece al instante en gris y se guarda por detrás; se puede seguir agregando sin esperar.
      const d0 = P.d;
      const tmp = { id: 'tmp-' + Math.random().toString(36).slice(2), usuario_id: P.lista, fecha: P.dia, titulo: f.titulo.trim(),
        prioridad: f.prioridad, detalle: '', hecho: false, de: '', en_calendario: false, guardando: true };
      d0.items.push(tmp);
      $('#fPend [name=titulo]').value = '';
      pintarPendientes();
      $('#fPend [name=titulo]').focus();
      try {
        const x = await api('guardarPendiente', { usuario_id: tmp.usuario_id, fecha: tmp.fecha, titulo: tmp.titulo, prioridad: tmp.prioridad });
        d0.items = d0.items.map(i => (i.id === tmp.id ? x : i));
      } catch (err) {
        d0.items = d0.items.filter(i => i.id !== tmp.id);
        aviso(err.message, 'error');
      }
      if (P.d === d0) pintarPendientes();
    };
    if ($('#bParaAdmin')) $('#bParaAdmin').onclick = formParaAdmin;
    if ($('#bHoy')) $('#bHoy').onclick = () => { P.dia = d.hoy; irDia(); };

    $('#vista').onclick = async e => {
      const lista = e.target.closest('[data-lista]');
      if (lista) { P.lista = lista.dataset.lista; return cargarPendientes().catch(err => aviso(err.message, 'error')); }
      const sem = e.target.closest('[data-sem]');
      if (sem) { P.dia = sumarDias(P.dia, Number(sem.dataset.sem)); return irDia(); }
      const dia = e.target.closest('[data-dia]');
      if (dia) { P.dia = dia.dataset.dia; return irDia(); }
      const b = e.target.closest('[data-acc]');
      if (!b) return;
      const id = b.closest('li').dataset.id;
      const x = P.d.items.find(i => i.id === id);
      if (!x || x.guardando) return;
      try {
        if (b.dataset.acc === 'hecho') {
          const d0 = P.d;
          reemplazarPend(Object.assign({}, x, { hecho: b.checked, guardando: true }));
          const r = await api('marcarPendiente', id, b.checked);
          if (P.d === d0) reemplazarPend(r);
        }
        else if (b.dataset.acc === 'abrir') formPendiente(x);
        else if (b.dataset.acc === 'calendario') formPendienteCalendario(x);
        else if (b.dataset.acc === 'eliminar' && await confirmar(`¿Eliminar «${x.titulo}»?`, 'Eliminar')) {
          P.d.items = P.d.items.filter(i => i.id !== id);
          pintarPendientes();
          await api('eliminarPendiente', id);
        }
      } catch (err) { aviso(err.message, 'error'); cargarPendientes().catch(() => {}); }
    };
  }

  /** Cambia de día: si sale de la semana cargada, pide la nueva semana. */
  function irDia() {
    const semana = lunesDe(P.dia);
    if (semana === P.semana) return pintarPendientes();
    P.semana = semana;
    cargarPendientes().catch(err => aviso(err.message, 'error'));
  }

  function reemplazarPend(x) {
    P.d.items = P.d.items.map(i => (i.id === x.id ? x : i));
    pintarPendientes();
  }

  /** Nota del pendiente, al estilo de Notas del iPhone: título y descripción con formato, sin límite práctico. */
  const BOTONES_NOTA = [
    ['formatBlock', '<h2>', 'Título', 'Título'], ['formatBlock', '<h3>', 'Subtítulo', 'Subtítulo'], ['formatBlock', '<p>', 'Texto', 'Texto normal'],
    ['bold', '', '<b>B</b>', 'Negrita'], ['italic', '', '<i>I</i>', 'Cursiva'], ['underline', '', '<u>U</u>', 'Subrayado'],
    ['strikeThrough', '', '<s>S</s>', 'Tachado'], ['insertUnorderedList', '', '• Lista', 'Lista con viñetas'],
    ['insertOrderedList', '', '1. Lista', 'Lista numerada'], ['removeFormat', '', '⌫ Formato', 'Quitar formato']];

  function formPendiente(x) {
    const { form } = modal('Nota', `
      <input class="nota-titulo" name="titulo" maxlength="500" value="${esc(x.titulo)}" required aria-label="Título">
      <div class="nota-barra" role="toolbar">${BOTONES_NOTA.map(([c, v, t, a]) =>
        `<button type="button" data-cmd="${c}" data-val="${esc(v)}" title="${a}" aria-label="${a}">${t}</button>`).join('')}</div>
      <div class="nota-editor" contenteditable="true" data-ph="Escribe aquí la descripción, ideas, pasos…">${htmlNota(x.detalle)}</div>
      <div class="dos">
        <label>Prioridad<select name="prioridad">${opciones(OPC_PRIO, x.prioridad)}</select></label>
        <label>Día<input type="date" name="fecha" value="${esc(x.fecha)}" required></label>
      </div>`,
      async f => {
        const ed = $('.nota-editor', form);
        f.detalle = ed.textContent.trim() ? ed.innerHTML : '';
        reemplazarPend(Object.assign({}, x, f, { guardando: true }));
        const r = await api('guardarPendiente', Object.assign({ id: x.id }, f));
        if (r.fecha !== x.fecha) await cargarPendientes(); else reemplazarPend(r);
        aviso('Nota guardada');
      }, 'Guardar', true, true);
    const ed = $('.nota-editor', form);
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* navegador sin soporte */ }
    // mousedown para no perder la selección del texto al pulsar los botones.
    $$('.nota-barra button', form).forEach(b => {
      b.onmousedown = e => e.preventDefault();
      b.onclick = () => { ed.focus(); document.execCommand(b.dataset.cmd, false, b.dataset.val || null); };
    });
    ed.onkeydown = e => {
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && ['b', 'i', 'u'].includes(k)) { e.preventDefault(); document.execCommand({ b: 'bold', i: 'italic', u: 'underline' }[k]); }
    };
    // Al pegar desde otro lado se conserva solo el formato permitido.
    ed.onpaste = e => {
      const html = e.clipboardData && e.clipboardData.getData('text/html');
      if (!html) return;
      e.preventDefault();
      document.execCommand('insertHTML', false, htmlNota(html));
    };
  }

  function formPendienteCalendario(x) {
    modal('Pasar al calendario', `
      <p class="sub">«${esc(x.titulo)}» se agregará a la agenda personal${x.usuario_id === S.u.id ? '' : ' de ' + esc(nombreDe(x.usuario_id))} (solo la ve su dueño).</p>
      <div class="dos">
        <label>Día<input type="date" name="fecha" value="${esc(x.fecha)}" required></label>
        <label>Hora (opcional)<input type="time" name="hora"></label>
      </div>
      <label>Recordatorio<select name="recordatorio_min">${opciones(OPC_RECORDATORIO, '')}</select></label>`,
      async f => {
        reemplazarPend(await api('pendienteACalendario', x.id, f));
        if (f.fecha !== x.fecha) await cargarPendientes();
        aviso('Agregado al calendario');
      }, 'Agregar al calendario');
  }

  /** Coordinación → admin: solo qué es y la prioridad. */
  function formParaAdmin() {
    modal('Dejar pendiente al administrador', `
      <label>¿De qué trata?<textarea name="titulo" rows="3" maxlength="200" required placeholder="Ej.: aprobar el presupuesto del evento de Huacho"></textarea></label>
      <label>Prioridad<select name="prioridad">${opciones(OPC_PRIO, 'media')}</select></label>
      <p class="sub">El administrador lo recibe en su lista de hoy y le llega una notificación. Tú solo verás la confirmación.</p>`,
      async f => {
        await api('guardarPendiente', { para_admin: true, titulo: f.titulo, prioridad: f.prioridad });
        aviso('Listo: el pendiente quedó agendado para el administrador');
        await cargarPendientes();
      }, 'Enviar');
  }
</script>
