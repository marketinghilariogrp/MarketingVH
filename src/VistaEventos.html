<script>
  /* ---------- Eventos y rotación del personal ---------- */

  const ESTADO_EV = { programado: 'Programado', realizado: 'Realizado', cancelado: 'Cancelado' };
  const mesActual = () => S.hoy.slice(0, 7);
  const cacheEventos = {};

  async function datosEventos(mes) {
    const r = await api('listarEventos', mes);
    cacheEventos[mes] = r;
    return r;
  }

  function chipsPersonal(ev) {
    if (!ev.personal.length) return `<span class="alerta">Sin personal</span>${ev.detalle ? ` <small>${esc(ev.detalle)}</small>` : ''}`;
    return ev.personal.map(p => `<span class="chip-persona${p.usuario_id === S.u.id ? ' yo' : ''}${p.estado === 'ausente' ? ' ausente' : ''}"
      title="${esc([p.funcion, p.zona, p.horario, p.estado === 'ausente' ? 'Ausente' : ''].filter(Boolean).join(' · '))}">
      ${esc(p.nombre)} <small>${esc(p.funcion)}${p.zona ? ' · ' + esc(p.zona) : ''}${p.horario ? ' · ' + esc(p.horario) : ''}</small></span>`).join('');
  }

  VISTAS.eventos = {
    titulo: 'Eventos y rotación del personal',
    async pintar() {
      const mes = S.mesEventos || mesActual();
      const d = await datosEventos(mes);
      if (S.vista !== 'eventos') return;
      const verAnio = !!S.rotacionAnio;
      const conteo = verAnio ? d.conteoAnio : d.conteoMes;
      const indiceClase = i => (i === null ? '' : i > 1.3 ? 'alto' : i < 0.7 ? 'bajo' : '');
      $('#vista').innerHTML = `
        <div class="toolbar">
          ${navMes(mes)}
          ${esGestor() ? '<button class="btn primario" id="bNuevoEv">+ Nuevo evento</button>' : ''}
        </div>
        <div class="rejilla-ev">
          <section class="card sin-pad">
            <div class="tabla-caja plana"><table>
              <thead><tr><th>Fecha</th><th>Evento</th><th>Personal</th><th>Estado</th>${esGestor() ? '<th></th>' : ''}</tr></thead>
              <tbody>${d.eventos.map(ev => `<tr class="${ev.estado === 'cancelado' ? 'inactivo' : ''}">
                <td><span class="fecha-chip">${diaSemana(ev.fecha)}<b>${ev.fecha.slice(8)}</b></span></td>
                <td class="ancho"><b>${esc(ev.titulo)}</b> <span class="etiqueta">${esc(ev.empresa)}</span>
                  <small>${[ev.hora_inicio && (ev.hora_inicio + (ev.hora_fin ? '–' + ev.hora_fin : '')), ev.lugar].filter(Boolean).map(esc).join(' · ')}</small></td>
                <td class="personal">${chipsPersonal(ev)}${S.cfg.gestionaAlquiler && ev.alquiler && ev.alquiler.length ? resumenAlquiler(ev.alquiler) : ''}</td>
                <td><span class="estado e-${esc(ev.estado)}">${ESTADO_EV[ev.estado] || esc(ev.estado)}</span></td>
                ${esGestor() ? `<td><button class="btn mini" data-editar="${esc(ev.id)}">Editar</button></td>` : ''}</tr>`).join('')
                || '<tr><td colspan="5" class="vacio">No hay eventos este mes.</td></tr>'}</tbody>
            </table></div>
          </section>
          <div class="columna-lateral">
          <section class="card">
            <div class="cab-card"><h3>Rotación</h3>
              <div class="pestanas mini"><button class="pestana ${verAnio ? '' : 'activo'}" data-rot="">Mes</button>
                <button class="pestana ${verAnio ? 'activo' : ''}" data-rot="1">Año ${mes.slice(0, 4)}</button></div></div>
            <p class="sub">Eventos cubiertos por persona. Índice 1 = reparto parejo.</p>
            ${barras(conteo.map(x => ({ k: x.nombre, v: x.eventos, extra: x.indice !== null ? '×' + x.indice : '', clase: indiceClase(x.indice) })),
              { vacio: 'Sin eventos cubiertos.' })}
          </section>
          ${esGestor() ? `<section class="card">
            <h3>Logística del evento</h3>
            <p class="sub">Lista de equipos y activos que salen al evento, con check de salida y retorno. Incluye los equipos alquilados.</p>
            <div class="logistica-elegir">
              <select id="lEvento" aria-label="Evento">${opciones(d.eventos.filter(e => e.estado !== 'cancelado').map(e => [e.id, fmtFecha(e.fecha).slice(0, 5) + ' · ' + e.titulo]), '', d.eventos.length ? 'Elige un evento…' : 'No hay eventos este mes')}</select>
              <button class="btn primario" id="bLogistica">Armar lista</button>
            </div>
          </section>` : ''}
          </div>
        </div>
        ${S.cfg.gestionaAlquiler ? htmlAlquilerMes(d.eventos) : ''}
        <section class="card sin-pad">
          <div class="cab-card pad"><h3>Historial ${mes.slice(0, 4)} · eventos cubiertos por persona y mes</h3></div>
          <p class="sub pad-x">Haz clic en un número para ver qué eventos cubrió esa persona ese mes.</p>
          <div class="tabla-caja plana"><table class="matriz">
            <thead><tr><th>Persona</th>${MESES.map((x, i) => `<th class="num${i + 1 === Number(mes.slice(5)) ? ' mes-actual' : ''}">${x.slice(0, 3)}</th>`).join('')}<th class="num">Total</th></tr></thead>
            <tbody>${d.historial.map(h => `<tr><td><b>${esc(h.nombre)}</b></td>
              ${h.meses.map((n, i) => `<td class="num${i + 1 === Number(mes.slice(5)) ? ' mes-actual' : ''}">${n ? `<button class="celda-n" data-hist="${esc(h.usuario_id)}" data-m="${i + 1}">${n}</button>` : '<span class="sub">·</span>'}</td>`).join('')}
              <td class="num"><b>${h.meses.reduce((a, b) => a + b, 0)}</b></td></tr>`).join('')}</tbody>
          </table></div>
        </section>`;
      $('.matriz').onclick = e => {
        const b = e.target.closest('[data-hist]');
        if (!b) return;
        const h = d.historial.find(x => x.usuario_id === b.dataset.hist);
        const mm = String(b.dataset.m).padStart(2, '0');
        const lista = h.eventos.filter(x => x.fecha.slice(5, 7) === mm);
        modal(`${h.nombre} · ${MESES[Number(mm) - 1]} ${mes.slice(0, 4)}`, `<ul class="lista">${lista.map(x => `<li>
          <span class="fecha-chip">${diaSemana(x.fecha)}<b>${x.fecha.slice(8)}</b></span>
          <div><b>${esc(x.titulo)}</b> <span class="etiqueta">${esc(x.empresa)}</span><small>${esc(x.funcion)}</small></div></li>`).join('')}</ul>`, null);
      };
      enlazarNavMes($('#vista'), mes, m => { S.mesEventos = m; repintar(); });
      if ($('#bLogistica')) $('#bLogistica').onclick = () => {
        const id = $('#lEvento').value;
        if (!id) return aviso('Elige un evento.', 'error');
        abrirLogistica(id);
      };
      $$('[data-rot]').forEach(b => { b.onclick = () => { S.rotacionAnio = !!b.dataset.rot; repintar(); }; });
      if (esGestor()) {
        $('#bNuevoEv').onclick = () => formEvento(null, mes === mesActual() ? S.hoy : mes + '-01');
        $('tbody').onclick = e => {
          const b = e.target.closest('[data-editar]');
          if (b) formEvento(d.eventos.find(x => x.id === b.dataset.editar));
        };
      }
    }
  };

  /* ---------- Alquiler de equipos (solo admin y Jefferson) ---------- */

  function filaAlquiler(a = {}) {
    return `<div class="fila-alquiler" data-id="${esc(a.id || '')}">
      <select data-k="equipo" aria-label="Equipo">${opciones(S.cfg.equiposAlquiler, a.equipo)}</select>
      <input data-k="detalle" placeholder="Modelo / detalle (ej. Sony FX3, 24-70 mm)" value="${esc(a.detalle)}" maxlength="200">
      <input data-k="cantidad" type="number" min="1" max="99" value="${esc(a.cantidad || 1)}" aria-label="Cantidad" title="Cantidad">
      <input data-k="proveedor" placeholder="Proveedor" value="${esc(a.proveedor)}" maxlength="120">
      <input data-k="costo" type="number" min="0" step="0.01" placeholder="Costo S/" value="${a.costo === null || a.costo === undefined ? '' : esc(a.costo)}" aria-label="Costo">
      <select data-k="estado" aria-label="Estado">${opciones(S.cfg.estadosAlquiler, a.estado)}</select>
      <button type="button" class="btn-ico quitar" aria-label="Quitar">×</button>
    </div>`;
  }

  function resumenAlquiler(lista) {
    const pendientes = lista.filter(a => a.estado === 'Por cotizar' || a.estado === 'Cotizado').length;
    const unidades = lista.reduce((s, a) => s + a.cantidad, 0);
    return `<span class="chip-alquiler${pendientes ? ' pendiente' : ''}" title="${esc(lista.map(a => a.cantidad + '× ' + a.equipo + (a.detalle ? ' (' + a.detalle + ')' : '') + ' · ' + a.estado).join('\n'))}">
      📦 ${unidades} equipo${unidades === 1 ? '' : 's'} a alquilar${pendientes ? ` · ${pendientes} por confirmar` : ''}</span>`;
  }

  function htmlAlquilerMes(eventos) {
    const conEq = eventos.filter(e => e.alquiler && e.alquiler.length && e.estado !== 'cancelado');
    if (!conEq.length) return '';
    const total = conEq.reduce((s, e) => s + e.alquiler.reduce((t, a) => t + (a.costo || 0), 0), 0);
    const pendientes = conEq.reduce((s, e) => s + e.alquiler.filter(a => a.estado === 'Por cotizar' || a.estado === 'Cotizado').length, 0);
    return `<section class="card sin-pad">
      <div class="cab-card pad"><h3>Alquiler de equipos del mes</h3>
        <span class="sub">${pendientes ? `<b class="alerta">${pendientes} por confirmar</b> · ` : ''}Costo estimado: <b>S/ ${fmtNum(total, 2)}</b></span></div>
      <div class="tabla-caja plana"><table>
        <thead><tr><th>Evento</th><th>Equipo</th><th class="num">Cant.</th><th>Proveedor</th><th class="num">Costo</th><th>Estado</th></tr></thead>
        <tbody>${conEq.map(e => e.alquiler.map((a, i) => `<tr>
          <td>${i ? '' : `<b>${fmtFecha(e.fecha)} · ${esc(e.titulo)}</b>`}</td>
          <td>${esc(a.equipo)}${a.detalle ? `<small>${esc(a.detalle)}</small>` : ''}</td><td class="num">${a.cantidad}</td>
          <td>${esc(a.proveedor) || '—'}</td><td class="num">${a.costo === null ? '—' : 'S/ ' + fmtNum(a.costo, 2)}</td>
          <td><span class="estado ${a.estado === 'Confirmado' || a.estado === 'Devuelto' ? 'e-realizado' : 'e-pendiente'}">${esc(a.estado)}</span></td></tr>`).join('')).join('')}</tbody>
      </table></div></section>`;
  }

  function filaPersonal(p = {}) {
    return `<div class="fila-personal">
      <select data-k="usuario_id" aria-label="Persona">${opciones(S.usuarios.filter(u => u.cubreEventos || u.id === p.usuario_id)
        .map(u => [u.id, u.nombre + (u.area ? ' · ' + u.area : '')]), p.usuario_id, 'Persona…')}</select>
      <select data-k="funcion" aria-label="Función">${opciones(S.cfg.funcionesEvento, p.funcion)}</select>
      <input data-k="zona" placeholder="Zona / etapa" value="${esc(p.zona)}" maxlength="120">
      <input data-k="horario" placeholder="Horario (ej. 8:00–14:00)" value="${esc(p.horario)}" maxlength="60">
      <label class="check"><input type="checkbox" data-k="ausente" ${p.estado === 'ausente' ? 'checked' : ''}> Faltó</label>
      <button type="button" class="btn-ico quitar" aria-label="Quitar">×</button>
    </div>`;
  }

  function funcionSugerida(area) {
    const a = String(area || '').toLowerCase();
    const f = S.cfg.funcionesEvento;
    if (a.includes('audiovisual') && f.includes('Audiovisual')) return 'Audiovisual';
    if ((a.includes('community') || a.includes('social')) && f.includes('CM')) return 'CM';
    return f.includes('Apoyo') ? 'Apoyo' : f[0];
  }

  /** Formulario de evento con su personal; muestra sugerencias según quién cubrió menos eventos en el mes. */
  async function formEvento(ev, fecha) {
    const x = ev || { fecha: fecha || S.hoy, estado: 'programado', personal: [] };
    const { form } = modal(ev ? 'Editar evento' : 'Nuevo evento', `
      <label>Nombre del evento<input name="titulo" maxlength="200" required value="${esc(x.titulo)}"></label>
      <div class="tres">
        <label>Fecha<input type="date" name="fecha" required value="${esc(x.fecha)}"></label>
        <label>Inicio<input type="time" name="hora_inicio" value="${esc(x.hora_inicio)}"></label>
        <label>Fin<input type="time" name="hora_fin" value="${esc(x.hora_fin)}"></label>
      </div>
      <div class="dos">
        <label>Empresa / marca<select name="empresa" required>${opciones(S.cfg.marcas, x.empresa, 'Elegir…')}</select></label>
        <label>Estado<select name="estado">${opciones(Object.entries(ESTADO_EV), x.estado)}</select></label>
      </div>
      <label>Lugar<input name="lugar" maxlength="200" value="${esc(x.lugar)}"></label>
      <label>Detalle<textarea name="detalle" rows="2" maxlength="2000">${esc(x.detalle)}</textarea></label>
      <div class="cab-card"><b>Personal del evento</b><button type="button" class="btn mini" id="bAgregarP">+ Agregar persona</button></div>
      <div id="personal">${x.personal.map(filaPersonal).join('')}</div>
      <div id="sugerencias" class="sugerencias"><small>Calculando sugerencias…</small></div>
      ${S.cfg.gestionaAlquiler ? `<div class="cab-card"><b>Alquiler de equipos</b><button type="button" class="btn mini" id="bAgregarEq">+ Agregar equipo</button></div>
        <p class="sub">Solo lo ven el administrador y Jefferson.</p>
        <div id="alquiler">${(x.alquiler || []).map(filaAlquiler).join('')}</div>
        <p class="sub" id="totalAlquiler"></p>` : ''}
      ${ev && esAdmin() ? '<div><button type="button" class="btn mini peligro" id="bEliminarEv">Eliminar este evento</button></div>' : ''}`,
      async (d, f) => {
        d.personal = $$('.fila-personal', f).map(fila => ({
          usuario_id: $('[data-k=usuario_id]', fila).value,
          funcion: $('[data-k=funcion]', fila).value,
          zona: $('[data-k=zona]', fila).value,
          horario: $('[data-k=horario]', fila).value,
          estado: $('[data-k=ausente]', fila).checked ? 'ausente' : ''
        }));
        if (d.personal.some(p => !p.usuario_id)) throw new Error('Elige a la persona en cada fila o quita la fila vacía.');
        if (S.cfg.gestionaAlquiler) d.alquiler = $$('.fila-alquiler', f).map(fila => ({
          id: fila.dataset.id || '',
          equipo: $('[data-k=equipo]', fila).value,
          detalle: $('[data-k=detalle]', fila).value,
          cantidad: $('[data-k=cantidad]', fila).value,
          proveedor: $('[data-k=proveedor]', fila).value,
          costo: $('[data-k=costo]', fila).value,
          estado: $('[data-k=estado]', fila).value
        }));
        if (ev) d.id = ev.id;
        const r = await api('guardarEvento', d);
        aviso(ev ? 'Evento actualizado' : 'Evento creado');
        r.avisos.forEach(a => aviso('Atención: ' + a, 'error'));
        delete cacheEventos[d.fecha.slice(0, 7)];
        if (['eventos', 'calendario', 'inicio'].includes(S.vista)) repintar();
      }, ev ? 'Guardar' : 'Crear evento', true, true);

    const cont = $('#personal', form);
    if ($('#bEliminarEv', form)) $('#bEliminarEv', form).onclick = () => eliminarEvento(ev, () => form.parentElement.remove());
    $('#bAgregarP', form).onclick = () => cont.insertAdjacentHTML('beforeend', filaPersonal({ funcion: S.cfg.funcionesEvento[0] }));
    cont.onclick = e => { if (e.target.closest('.quitar')) e.target.closest('.fila-personal').remove(); };
    if (S.cfg.gestionaAlquiler) {
      const eq = $('#alquiler', form);
      const total = () => {
        const suma = $$('[data-k=costo]', eq).reduce((s, i) => s + (Number(i.value) || 0), 0);
        $('#totalAlquiler', form).textContent = $$('.fila-alquiler', eq).length ? `Costo total estimado: S/ ${fmtNum(suma, 2)}` : '';
      };
      $('#bAgregarEq', form).onclick = () => { eq.insertAdjacentHTML('beforeend', filaAlquiler({})); total(); };
      eq.onclick = e => { if (e.target.closest('.quitar')) { e.target.closest('.fila-alquiler').remove(); total(); } };
      eq.oninput = total;
      total();
    }

    // Sugerencias: personas de la rotación (incluye practicantes) ordenadas por menos eventos en el mes.
    const pintarSug = async () => {
      const mes = ($('[name=fecha]', form).value || S.hoy).slice(0, 7);
      let datos = cacheEventos[mes];
      try { if (!datos) datos = await datosEventos(mes); } catch (e) { return; }
      const cuenta = {};
      datos.conteoMes.forEach(c => { cuenta[c.usuario_id] = c.eventos; });
      const ya = $$('[data-k=usuario_id]', cont).map(s => s.value);
      const lista = S.usuarios.filter(u => u.cubreEventos && !ya.includes(u.id))
        .sort((a, b) => (cuenta[a.id] || 0) - (cuenta[b.id] || 0) || a.nombre.localeCompare(b.nombre)).slice(0, 8);
      $('#sugerencias', form).innerHTML = lista.length ? `<small>Sugeridos (menos eventos en ${MESES[Number(mes.slice(5)) - 1].toLowerCase()}):</small>` +
        lista.map(u => `<button type="button" class="chip-sug" data-u="${esc(u.id)}">${esc(u.nombre)} <small>${cuenta[u.id] || 0}</small></button>`).join('') : '';
    };
    $('#sugerencias', form).onclick = e => {
      const b = e.target.closest('[data-u]');
      if (!b) return;
      const u = S.usuarios.find(x => x.id === b.dataset.u);
      cont.insertAdjacentHTML('beforeend', filaPersonal({ usuario_id: u.id, funcion: funcionSugerida(u.area) }));
      pintarSug();
    };
    cont.onchange = pintarSug;
    $('[name=fecha]', form).onchange = pintarSug;
    pintarSug();
  }

  /* ---------- Agenda: elementos del equipo (grabaciones, entregables…) y agenda personal privada ---------- */

  const RECORDATORIO_TXT = [['', 'Sin recordatorio'], ['0', 'A la hora'], ['10', '10 minutos antes'], ['30', '30 minutos antes'],
    ['60', '1 hora antes'], ['120', '2 horas antes'], ['1440', '1 día antes']];

  function formAgenda(a, fecha) {
    const g = esGestor();
    const x = a || { fecha: fecha || S.hoy, tipo: g ? S.cfg.tiposAgenda[0] : S.cfg.tiposAgendaPersonal[0], privado: !g, recordatorio_min: '' };
    const tipos = g
      ? `<optgroup label="Equipo">${opciones(S.cfg.tiposAgenda, x.tipo)}</optgroup><optgroup label="Personal">${opciones(S.cfg.tiposAgendaPersonal, x.tipo)}</optgroup>`
      : opciones(S.cfg.tiposAgendaPersonal, x.tipo);
    const { form, cerrar } = modal(a ? 'Editar en la agenda' : (g ? 'Agregar a la agenda' : 'Agregar a mi agenda'), `
      ${g ? '' : '<p class="sub">Tu agenda es personal: solo tú la ves.</p>'}
      <label>Título<input name="titulo" maxlength="200" required value="${esc(x.titulo)}" placeholder="${g ? 'Ej.: grabación testimonios' : 'Ej.: reunión con proveedor'}"></label>
      <div class="tres">
        <label>Tipo<select name="tipo" required>${tipos}</select></label>
        <label>Fecha<input type="date" name="fecha" required value="${esc(x.fecha)}"></label>
        <label>Hora<input type="time" name="hora" value="${esc(x.hora)}"></label>
      </div>
      <label>Recordatorio<select name="recordatorio_min">${opciones(RECORDATORIO_TXT, String(x.recordatorio_min ?? ''))}</select></label>
      <p class="sub">El recordatorio te llega como notificación en la plataforma y a tu correo (necesita hora).</p>
      ${g ? `<div class="dos">
          <label>Marca<select name="marca">${opciones(S.cfg.marcas, x.marca, '—')}</select></label>
          <label>Campaña<input name="campana" maxlength="120" value="${esc(x.campana)}"></label>
        </div>
        <label>Responsable<select name="responsable_id">${opcionesPersonas(x.responsable_id, '—')}</select></label>
        <label class="check"><input type="checkbox" name="privado" ${x.privado ? 'checked' : ''}> Solo para mí (agenda personal, nadie más la ve)</label>` : ''}
      <label>Detalle<textarea name="detalle" rows="2" maxlength="2000">${esc(x.detalle)}</textarea></label>
      ${a && a.eliminable ? '<div><button type="button" class="btn mini peligro" id="bEliminarAg">Eliminar</button></div>' : ''}`,
      async d => {
        if (a) d.id = a.id;
        d.privado = d.privado === 'on';
        await api('guardarAgenda', d);
        aviso('Agenda actualizada');
        repintar();
      }, a ? 'Guardar' : 'Agregar');
    if ($('#bEliminarAg', form)) $('#bEliminarAg', form).onclick = () => eliminarAgendaItem(a, cerrar);
  }

  async function marcarAgenda(id, estado) {
    try { await api('estadoAgenda', id, estado); aviso(estado === 'hecho' ? 'Marcado como hecho' : 'Actualizado'); repintar(); }
    catch (e) { aviso(e.message, 'error'); }
  }

  async function eliminarAgendaItem(a, alTerminar) {
    await confirmar(`¿Eliminar «${a.titulo}» de la agenda?`, 'Eliminar');
    try { await api('eliminarAgenda', a.id); if (alTerminar) alTerminar(); aviso('Eliminado'); repintar(); }
    catch (e) { aviso(e.message, 'error'); }
  }

  async function eliminarEvento(ev, alTerminar) {
    await confirmar(`¿Eliminar el evento «${ev.titulo}» del ${fmtFecha(ev.fecha)}? Dejará de verse en el calendario y en la rotación.`, 'Eliminar');
    try {
      await api('eliminarEvento', ev.id);
      delete cacheEventos[ev.fecha.slice(0, 7)];
      if (alTerminar) alTerminar();
      aviso('Evento eliminado');
      repintar();
    } catch (e) { aviso(e.message, 'error'); }
  }

  /* ---------- Calendario: vista de mes y vista de día por horas ---------- */

  const claseAgenda = t => 'ag-' + String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');
  const claseItemAgenda = a => (a.privado ? 'ag-personal' : claseAgenda(a.tipo));
  const datosCal = {};

  async function cargarMesCal(mes) {
    datosCal[mes] = await api('getCalendario', mes);
    return datosCal[mes];
  }

  VISTAS.calendario = {
    titulo: 'Calendario',
    async pintar() {
      const modo = S.modoCal || 'mes';
      const dia = S.diaCal || S.hoy;
      const mes = modo === 'dia' ? dia.slice(0, 7) : (S.mesCal || S.hoy.slice(0, 7));
      const d = await cargarMesCal(mes);
      if (S.vista !== 'calendario') return;
      $('#vista').innerHTML = `
        <div class="toolbar">
          <div class="controles">
            <div class="pestanas"><button class="pestana ${modo === 'mes' ? 'activo' : ''}" data-modo="mes">Mes</button>
              <button class="pestana ${modo === 'dia' ? 'activo' : ''}" data-modo="dia">Día</button></div>
            ${modo === 'mes' ? navMes(mes) : `<div class="nav-mes"><button type="button" class="btn-ico" data-dia="-1" aria-label="Día anterior">‹</button>
              <strong>${diaSemana(dia)} ${fmtFecha(dia)}</strong><button type="button" class="btn-ico" data-dia="1" aria-label="Día siguiente">›</button></div>`}
          </div>
          <div class="controles">
            ${(modo === 'mes' ? mes !== S.hoy.slice(0, 7) : dia !== S.hoy) ? '<button class="btn" id="bHoy">Hoy</button>' : ''}
            <button class="btn" id="bAgenda">${esGestor() ? '+ Agenda' : '+ Mi agenda'}</button>
            ${esGestor() ? '<button class="btn primario" id="bEvento">+ Evento</button>' : ''}
          </div>
        </div>
        <div class="leyenda"><span><i class="ev"></i>Evento</span><span><i class="ta"></i>Entrega de tarea</span><span><i class="ag-personal"></i>Mi agenda</span>
          ${S.cfg.tiposAgenda.map(t => `<span><i class="${claseAgenda(t)}"></i>${esc(t)}</span>`).join('')}</div>
        ${modo === 'mes' ? htmlMes(mes, d) : htmlDia(dia, d)}`;

      $$('[data-modo]').forEach(b => { b.onclick = () => { S.modoCal = b.dataset.modo; repintar(); }; });
      if (modo === 'mes') enlazarNavMes($('#vista'), mes, m => { S.mesCal = m; repintar(); });
      $$('[data-dia]').forEach(b => { b.onclick = () => { S.diaCal = sumarDias(dia, Number(b.dataset.dia)); repintar(); }; });
      if ($('#bHoy')) $('#bHoy').onclick = () => { S.mesCal = S.hoy.slice(0, 7); S.diaCal = S.hoy; repintar(); };
      const fechaNueva = modo === 'dia' ? dia : (mes === S.hoy.slice(0, 7) ? S.hoy : mes + '-01');
      $('#bAgenda').onclick = () => formAgenda(null, fechaNueva);
      if ($('#bEvento')) $('#bEvento').onclick = () => formEvento(null, fechaNueva);

      $('#vista').onclick = e => {
        const celda = e.target.closest('.calendario [data-f]');
        if (celda) { S.diaCal = celda.dataset.f; S.modoCal = 'dia'; return repintar(); }
        const it = e.target.closest('[data-item]');
        if (it) abrirItem(it.dataset.item, it.dataset.id, d);
      };
    }
  };

  function itemsDelDia(f, d) {
    return {
      eventos: d.eventos.filter(e => e.fecha === f),
      agenda: d.agenda.filter(a => a.fecha === f),
      tareas: d.tareas.filter(t => t.vence === f)
    };
  }

  function htmlMes(mes, d) {
    const primero = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5)) - 1, 1);
    const offset = (primero.getDay() + 6) % 7;
    const diasMes = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate();
    const celdas = [];
    for (let i = 0; i < offset; i++) celdas.push('<div class="dia vacio-dia"></div>');
    for (let n = 1; n <= diasMes; n++) {
      const f = `${mes}-${String(n).padStart(2, '0')}`;
      const x = itemsDelDia(f, d);
      const items = [].concat(
        x.eventos.map(e => ({ clase: 'ev' + (e.estado === 'cancelado' ? ' tachado' : ''), texto: (e.hora_inicio ? e.hora_inicio + ' ' : '') + e.titulo })),
        x.agenda.sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99')).map(a => ({ clase: claseItemAgenda(a) + (a.estado !== 'pendiente' ? ' tachado' : ''), texto: (a.hora ? a.hora + ' ' : '') + a.titulo })),
        x.tareas.map(t => ({ clase: 'ta' + (t.estado === 'aprobada' ? ' tachado' : ''), texto: 'Entrega: ' + t.titulo })));
      celdas.push(`<button class="dia${f === S.hoy ? ' hoy' : ''}${d.feriados.includes(f) ? ' feriado' : ''}" data-f="${f}">
        <span class="num-dia">${n}</span>
        ${items.slice(0, 3).map(it => `<span class="item ${it.clase}">${esc(it.texto)}</span>`).join('')}
        ${items.length > 3 ? `<span class="mas">+${items.length - 3} más</span>` : ''}
        ${items.length ? `<span class="puntos">${items.slice(0, 5).map(it => `<i class="${it.clase.split(' ')[0]}"></i>`).join('')}</span>` : ''}
      </button>`);
    }
    return `<div class="calendario">${DIAS.map(x => `<div class="cab-dia">${x}</div>`).join('')}${celdas.join('')}</div>
      <p class="sub">Toca un día para verlo por horas.</p>`;
  }

  const HORA_INI = 6;
  const HORA_FIN = 24;
  const ALTO_HORA = 56;

  /** Vista de un día al estilo del calendario del iPhone: franja de horas y bloques por horario. */
  function htmlDia(f, d) {
    const x = itemsDelDia(f, d);
    const minutos = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
    const bloques = [];
    const todoElDia = [];
    x.eventos.forEach(e => {
      const it = { tipo: 'evento', id: e.id, clase: 'ev' + (e.estado === 'cancelado' ? ' tachado' : ''), titulo: e.titulo,
        sub: [e.empresa, e.lugar, e.personal.map(p => p.nombre).join(', ')].filter(Boolean).join(' · ') };
      if (e.hora_inicio) {
        const ini = minutos(e.hora_inicio);
        bloques.push(Object.assign(it, { ini, fin: e.hora_fin ? Math.max(minutos(e.hora_fin), ini + 30) : ini + 60, hora: e.hora_inicio + (e.hora_fin ? '–' + e.hora_fin : '') }));
      } else todoElDia.push(it);
    });
    x.agenda.forEach(a => {
      const it = { tipo: 'agenda', id: a.id, clase: claseItemAgenda(a) + (a.estado !== 'pendiente' ? ' tachado' : ''),
        titulo: (a.privado ? '' : a.tipo + ': ') + a.titulo, sub: [a.marca, a.red, a.responsable && !a.privado ? a.responsable : ''].filter(Boolean).join(' · ') };
      if (a.hora) { const ini = minutos(a.hora); bloques.push(Object.assign(it, { ini, fin: ini + 30, hora: a.hora })); }
      else todoElDia.push(it);
    });
    x.tareas.forEach(t => todoElDia.push({ tipo: 'tarea', id: t.id, clase: 'ta' + (t.estado === 'aprobada' ? ' tachado' : ''),
      titulo: 'Entrega: ' + t.titulo, sub: [t.marca, t.responsable].filter(Boolean).join(' · ') }));

    // Carriles para que los bloques que se cruzan queden lado a lado.
    bloques.sort((a, b) => a.ini - b.ini);
    const finCarril = [];
    bloques.forEach(b => {
      let c = finCarril.findIndex(fin => fin <= b.ini);
      if (c < 0) { c = finCarril.length; finCarril.push(0); }
      finCarril[c] = b.fin;
      b.carril = c;
    });
    const carriles = Math.max(1, finCarril.length);
    const desde = Math.min(HORA_INI * 60, ...bloques.map(b => Math.floor(b.ini / 60) * 60));
    const horas = [];
    for (let h = desde / 60; h < HORA_FIN; h++) horas.push(h);
    const ahora = new Date();
    const minAhora = ahora.getHours() * 60 + ahora.getMinutes();

    return `
      ${d.feriados.includes(f) ? '<p class="sub"><b>Feriado</b></p>' : ''}
      ${todoElDia.length ? `<section class="card todo-dia"><h4>Todo el día</h4>${todoElDia.map(it =>
        `<button class="bloque-fijo ${it.clase.split(' ')[0]}${it.clase.includes('tachado') ? ' tachado' : ''}" data-item="${it.tipo}" data-id="${esc(it.id)}">
          <b>${esc(it.titulo)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</button>`).join('')}</section>` : ''}
      <section class="card sin-pad dia-linea">
        <div class="horas" style="height:${horas.length * ALTO_HORA}px">
          ${horas.map((h, i) => `<div class="hora" style="top:${i * ALTO_HORA}px"><span>${String(h).padStart(2, '0')}:00</span></div>`).join('')}
          ${f === S.hoy && minAhora >= desde ? `<div class="ahora" style="top:${(minAhora - desde) / 60 * ALTO_HORA}px"></div>` : ''}
          <div class="bloques">${bloques.map(b => `<button class="bloque ${b.clase.split(' ')[0]}${b.clase.includes('tachado') ? ' tachado' : ''}"
            data-item="${b.tipo}" data-id="${esc(b.id)}"
            style="top:${(b.ini - desde) / 60 * ALTO_HORA}px;height:${Math.max(26, (b.fin - b.ini) / 60 * ALTO_HORA - 2)}px;left:calc(${b.carril / carriles * 100}% + 2px);width:calc(${100 / carriles}% - 4px)">
            <b>${esc(b.titulo)}</b><small>${esc(b.hora)}${b.sub ? ' · ' + esc(b.sub) : ''}</small></button>`).join('')}</div>
        </div>
        ${!bloques.length && !todoElDia.length ? '<p class="vacio">No hay nada agendado este día.</p>' : ''}
      </section>`;
  }

  /** Detalle de un evento, elemento de agenda o entrega, con sus acciones. */
  function abrirItem(tipo, id, d) {
    if (tipo === 'evento') {
      const e = d.eventos.find(x => x.id === id);
      if (esGestor()) return formEvento(e);
      return modal(e.titulo, `<p class="sub">${[fmtFecha(e.fecha), e.hora_inicio && (e.hora_inicio + (e.hora_fin ? '–' + e.hora_fin : '')), e.empresa, e.lugar, ESTADO_EV[e.estado]].filter(Boolean).map(esc).join(' · ')}</p>
        ${e.detalle ? `<p>${esc(e.detalle)}</p>` : ''}<div class="personal">${chipsPersonal(e)}</div>`, null);
    }
    if (tipo === 'tarea') {
      const t = d.tareas.find(x => x.id === id);
      return modal('Entrega: ' + t.titulo, `<p class="sub">${[fmtFecha(t.vence), t.marca, t.responsable, ESTADO_TAREA[t.estado]].filter(Boolean).map(esc).join(' · ')}</p>`, null);
    }
    const a = d.agenda.find(x => x.id === id);
    if (a.editable) return formAgenda(a);
    const { form, cerrar } = modal((a.privado ? '' : a.tipo + ': ') + a.titulo, `
      <p class="sub">${[fmtFecha(a.fecha) + (a.hora ? ' ' + a.hora : ''), a.marca, a.red, a.formato, a.pilar, a.responsable].filter(Boolean).map(esc).join(' · ')}</p>
      ${a.detalle ? `<p>${esc(a.detalle)}</p>` : ''}
      ${a.parrilla ? '<p class="sub">Viene de la parrilla de la marca: se edita en su Google Sheet.</p>' : ''}
      <div class="acciones">${a.marcable && a.estado === 'pendiente' ? '<button type="button" class="btn mini ok" id="bHechoAg">Marcar hecho</button>' : ''}
        ${a.eliminable ? '<button type="button" class="btn mini peligro" id="bEliminarAg2">Eliminar</button>' : ''}</div>`, null);
    if ($('#bHechoAg', form)) $('#bHechoAg', form).onclick = () => { cerrar(); marcarAgenda(a.id, 'hecho'); };
    if ($('#bEliminarAg2', form)) $('#bEliminarAg2', form).onclick = () => eliminarAgendaItem(a, cerrar);
  }

  /* ---------- Logística del evento: equipos y activos con check de salida y retorno ---------- */

  async function abrirLogistica(eventoId) {
    let d;
    try { d = await api('getLogistica', eventoId); } catch (e) { return aviso(e.message, 'error'); }
    const ev = d.evento;
    let items = d.items.map(x => Object.assign({}, x));
    const responsables = S.usuarios.map(u => u.nombre);

    const { form, cerrar } = modal(`Logística · ${ev.titulo}`, `
      <p class="sub">${[fmtFecha(ev.fecha), ev.hora_inicio && (ev.hora_inicio + (ev.hora_fin ? '–' + ev.hora_fin : '')), ev.lugar, ev.empresa].filter(Boolean).map(esc).join(' · ')}</p>
      <datalist id="dlCatalogo">${d.catalogo.map(c => `<option value="${esc(c.nombre)}">${esc(c.categoria)}</option>`).join('')}</datalist>
      <datalist id="dlResp">${responsables.map(r => `<option value="${esc(r)}">`).join('')}</datalist>
      <div class="log-agregar">
        <label class="log-nombre">Equipo / Activo<input id="lNombre" list="dlCatalogo" placeholder="Busca o escribe (ej. Cámara Sony FX3)" autocomplete="off"></label>
        <label>Categoría<select id="lCategoria">${opciones(d.categorias, d.categorias[0])}</select></label>
        <label>Cant.<input id="lCantidad" type="number" min="1" value="1"></label>
        <label>Origen / Ubicación${campoOrigen('', 'lOrigen')}</label>
        <label>Responsable<input id="lResp" list="dlResp" placeholder="Nombre"></label>
        <button type="button" class="btn primario" id="lAgregar">Agregar</button>
      </div>
      <p class="sub">Los equipos que registres quedan guardados en el buscador para la próxima vez.</p>
      <div class="tabla-caja plana"><table class="log-tabla">
        <thead><tr><th>Ítem</th><th>Categoría</th><th>Equipo / Activo</th><th>Cant.</th><th>Origen / Ubicación</th><th>Responsable</th><th>Observaciones</th><th></th></tr></thead>
        <tbody id="lFilas"></tbody>
      </table></div>
      ${d.url ? `<p class="sub">Último Google Sheet generado: <a href="${esc(d.url)}" target="_blank" rel="noopener">abrir ↗</a></p>` : ''}
      <div class="log-acciones">
        <button type="button" class="btn" id="lImprimir">Imprimir checklist</button>
        <button type="button" class="btn" id="lHoja">Generar Google Sheet</button>
      </div>`,
      async () => { await guardar(); aviso('Lista de logística guardada'); }, 'Guardar lista', true, true);

    form.classList.add('muy-ancho');
    const tbody = $('#lFilas', form);
    const pintar = () => {
      const filas = items.map((x, i) => `<tr data-i="${i}">
          <td>${i + 1}</td>
          <td><select data-k="categoria">${opciones(d.categorias.includes(x.categoria) ? d.categorias : d.categorias.concat(x.categoria), x.categoria)}</select></td>
          <td class="ancho"><b>${esc(x.nombre)}</b></td>
          <td><input class="cant" data-k="cantidad" type="number" min="1" value="${esc(x.cantidad)}"></td>
          <td>${campoOrigen(x.origen)}</td>
          <td><input data-k="responsable" list="dlResp" value="${esc(x.responsable)}"></td>
          <td><input data-k="observaciones" value="${esc(x.observaciones)}" placeholder="Ej. falta cargar"></td>
          <td><button type="button" class="btn-ico quitar" aria-label="Quitar">×</button></td></tr>`).join('');
      const alquilados = d.alquiler.map((x, i) => `<tr class="alquilado">
          <td>${items.length + i + 1}</td><td>Alquiler</td><td class="ancho"><b>${esc(x.nombre)}</b></td><td>${x.cantidad}</td>
          <td>${esc(x.origen)}</td><td>${esc(x.responsable || '—')}</td><td><small>${esc(x.observaciones)}</small></td><td title="Se incluye automáticamente">🔒</td></tr>`).join('');
      tbody.innerHTML = filas + alquilados || '<tr><td colspan="8" class="vacio">Agrega los equipos y activos que salen al evento.</td></tr>';
    };
    pintar();

    // Al elegir un equipo del buscador se completan su categoría y su origen.
    $('#lNombre', form).oninput = e => {
      const c = d.catalogo.find(x => normalTexto(x.nombre) === normalTexto(e.target.value));
      if (!c) return;
      if (d.categorias.includes(c.categoria)) $('#lCategoria', form).value = c.categoria;
      if (c.origen) ponerOrigen($('#lOrigenSel', form), c.origen);
    };
    $('#lOrigenSel', form).onchange = e => alCambiarOrigen(e.target);
    const agregar = () => {
      const nombre = $('#lNombre', form).value.trim();
      if (!nombre) return aviso('Escribe o elige el equipo.', 'error');
      const cant = Number($('#lCantidad', form).value) || 1;
      const existe = items.find(x => normalTexto(x.nombre) === normalTexto(nombre));
      if (existe) existe.cantidad = Number(existe.cantidad) + cant;
      else items.push({ id: '', categoria: $('#lCategoria', form).value, nombre, cantidad: cant,
        origen: $('#lOrigen', form).value.trim() || ORIGEN_BASE, responsable: $('#lResp', form).value.trim(), observaciones: '' });
      $('#lNombre', form).value = '';
      $('#lCantidad', form).value = 1;
      $('#lNombre', form).focus();
      pintar();
    };
    $('#lAgregar', form).onclick = agregar;
    $('#lNombre', form).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); agregar(); } };
    tbody.oninput = tbody.onchange = e => {
      const tr = e.target.closest('tr[data-i]');
      if (!tr) return;
      if (e.target.matches('[data-origen]')) { if (e.type === 'change') items[Number(tr.dataset.i)].origen = alCambiarOrigen(e.target); return; }
      if (!e.target.dataset.k) return;
      items[Number(tr.dataset.i)][e.target.dataset.k] = e.target.value;
    };
    tbody.onclick = e => {
      if (!e.target.closest('.quitar')) return;
      items.splice(Number(e.target.closest('tr').dataset.i), 1);
      pintar();
    };

    const guardar = async () => {
      d = await api('guardarLogistica', eventoId, items);
      items = d.items.map(x => Object.assign({}, x));
      pintar();
    };
    $('#lHoja', form).onclick = async e => {
      const b = e.target;
      b.disabled = true;
      b.textContent = 'Generando…';
      try {
        await guardar();
        const r = await api('exportarLogistica', eventoId);
        d.url = r.url;
        modal('Logística lista', `<p>Se generó «${esc(r.titulo)}» con ${r.items} ítems, en tu Drive (carpeta «MarketingVH · Logística»).
          Si lo vuelves a generar, se actualiza el mismo archivo.</p>
          <p><a class="btn primario" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir Google Sheet ↗</a></p>`, null);
      } catch (err) { aviso(err.message, 'error'); }
      b.disabled = false;
      b.textContent = 'Generar Google Sheet';
    };
    $('#lImprimir', form).onclick = () => imprimirLogistica(ev, items, d.alquiler);
  }

  /** Origen / ubicación: «Marketing» por defecto, o «Otro…» para escribirlo a mano. */
  const ORIGEN_BASE = 'Marketing';
  const esOrigenBase = v => !v || normalTexto(v) === normalTexto(ORIGEN_BASE);
  const campoOrigen = (v, id) => `<span class="log-origen">
      <select data-origen${id ? ` id="${id}Sel"` : ''}><option value="base"${esOrigenBase(v) ? ' selected' : ''}>${ORIGEN_BASE}</option>
        <option value="otro"${esOrigenBase(v) ? '' : ' selected'}>Otro…</option></select>
      <input data-k="origen"${id ? ` id="${id}"` : ''} value="${esc(esOrigenBase(v) ? ORIGEN_BASE : v)}" placeholder="Escribe la ubicación"${esOrigenBase(v) ? ' hidden' : ''}></span>`;
  /** Muestra u oculta el campo manual y devuelve el origen resultante. */
  const alCambiarOrigen = sel => {
    const inp = sel.parentNode.querySelector('input');
    const otro = sel.value === 'otro';
    inp.hidden = !otro;
    inp.value = otro ? '' : ORIGEN_BASE;
    if (otro) inp.focus();
    return inp.value;
  };
  const ponerOrigen = (sel, v) => {
    sel.value = esOrigenBase(v) ? 'base' : 'otro';
    const inp = sel.parentNode.querySelector('input');
    inp.hidden = esOrigenBase(v);
    inp.value = esOrigenBase(v) ? ORIGEN_BASE : v;
  };

  const normalTexto = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();

  /** Imprime el checklist con casillas de salida y retorno para marcar a mano. */
  function imprimirLogistica(ev, items, alquiler) {
    const orden = [];
    items.forEach(x => { if (!orden.includes(x.categoria)) orden.push(x.categoria); });
    const filas = orden.reduce((acc, c) => acc.concat(items.filter(x => x.categoria === c)), []).concat(alquiler);
    $('#zonaImpresion').innerHTML = `
      <h1>LOGÍSTICA · ${esc(ev.titulo.toUpperCase())}</h1>
      <p><b>${[fmtFecha(ev.fecha), ev.hora_inicio && (ev.hora_inicio + (ev.hora_fin ? '–' + ev.hora_fin : '')), ev.lugar, ev.empresa].filter(Boolean).map(esc).join('  ·  ')}</b>
        ${ev.personal.length ? `<br>Equipo de marketing: ${esc(ev.personal.join(', '))}` : ''}</p>
      <table><thead><tr><th>Ítem</th><th>Categoría</th><th>Equipo / Activo</th><th>Cant.</th><th>Origen / Ubicación</th><th>Responsable</th><th>Salida</th><th>Retorno</th><th>Observaciones</th></tr></thead>
      <tbody>${filas.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.categoria)}</td><td>${esc(x.nombre)}</td><td>${esc(x.cantidad)}</td>
        <td>${esc(x.origen)}</td><td>${esc(x.responsable)}</td><td style="text-align:center"><span class="caja"></span></td>
        <td style="text-align:center"><span class="caja"></span></td><td>${esc(x.observaciones)}</td></tr>`).join('')}</tbody></table>
      <div class="firmas"><span>Entregó</span><span>Recibió</span><span>Retornó</span></div>`;
    document.body.classList.add('imprimiendo');
    const limpiar = () => { document.body.classList.remove('imprimiendo'); window.removeEventListener('afterprint', limpiar); };
    window.addEventListener('afterprint', limpiar);
    window.print();
    setTimeout(limpiar, 1000);
  }
</script>
