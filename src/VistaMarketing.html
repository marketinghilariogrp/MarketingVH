<script>
  /* ---------- Contenido: parrillas por marca + agenda de publicaciones, grabaciones y entregables ---------- */

  VISTAS.contenido = {
    titulo: 'Contenido y parrillas',
    async pintar() {
      if (!esGestor()) return pintarParrillasLectura();
      const desde = sumarDias(S.hoy, -30);
      const hasta = sumarDias(S.hoy, 45);
      const [parrillas, agenda] = await Promise.all([api('listarParrillas'), api('listarAgenda', desde, hasta)]);
      if (S.vista !== 'contenido') return;
      const marca = S.marcaContenido || '';
      const deMarca = a => !marca || a.marca === marca;
      const atrasados = agenda.filter(a => a.estado === 'pendiente' && a.fecha < S.hoy && deMarca(a));
      const proximos = agenda.filter(a => a.fecha >= S.hoy && a.estado !== 'cancelado' && deMarca(a));
      const sinParrilla = S.cfg.marcas.filter(m => !parrillas.some(p => p.marca === m && p.nombre.indexOf('PARRILLA ') === 0));
      const filaAgenda = a => `<li class="${a.fecha < S.hoy && a.estado === 'pendiente' ? 'atrasado' : ''}">
        <span class="fecha-chip">${diaSemana(a.fecha)}<b>${a.fecha.slice(8)}</b></span>
        <div><b>${esc(a.titulo)}</b> <span class="etiqueta ${claseAgenda(a.tipo)}">${esc(a.tipo)}</span>
          <small>${[fmtFecha(a.fecha) + (a.hora ? ' ' + a.hora : ''), a.marca, a.red, a.formato, a.pilar, a.responsable].filter(Boolean).map(esc).join(' · ')}</small></div>
        <div class="acciones">
          ${a.estado === 'hecho' ? `<span class="estado e-hecho">${a.parrilla ? 'Publicado' : 'Hecho'}</span>` : ''}
          ${a.estado_material ? `<span class="etiqueta">Diseño: ${esc(a.estado_material)}</span>` : ''}
          ${a.enlace && /^https?:\/\//.test(a.enlace) ? `<a class="btn mini fantasma" href="${esc(a.enlace)}" target="_blank" rel="noopener">Material ↗</a>` : ''}
          ${a.marcable && a.estado === 'pendiente' ? `<button class="btn mini ok" data-hecho="${esc(a.id)}">Hecho</button>` : ''}
          ${a.editable ? `<button class="btn mini fantasma" data-ag="${esc(a.id)}">Editar</button>` : ''}
        </div></li>`;

      $('#vista').innerHTML = `
        <section class="card">
          <div class="cab-card"><h3>Parrillas de contenido</h3>
            <div class="controles">
              ${esGestor() ? '<button class="btn mini" id="bSync">↻ Sincronizar ahora</button><button class="btn mini" id="bParrilla">+ Vincular otra</button>' : ''}
              ${esAdmin() && sinParrilla.length ? `<button class="btn mini primario" id="bCrearP">Crear parrillas (${sinParrilla.length})</button>` : ''}
            </div></div>
          <p class="sub">Cada marca tiene su Google Sheet con una pestaña por mes. Lo que se llena ahí aparece solo en el calendario (se sincroniza cada hora).
            Para que cuente como publicado, marca el <b>Estado</b> como «Publicado».</p>
          ${parrillas.length ? `<div class="tabla-caja plana"><table>
            <thead><tr><th>Marca</th><th>Parrilla</th><th>Última sincronización</th><th></th></tr></thead>
            <tbody>${parrillas.map(p => `<tr><td><b>${esc(p.marca)}</b></td>
              <td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.nombre)} ↗</a></td>
              <td>${p.ultima_sync ? fmtFecha(p.ultima_sync) + ' ' + esc(p.ultima_sync.slice(11, 16)) : '—'}
                <small class="${String(p.estado_sync).indexOf('Error') === 0 ? 'alerta' : ''}">${esc(p.estado_sync)}</small></td>
              <td>${esGestor() ? `<button class="btn-ico" data-parrilla="${esc(p.id)}" aria-label="Editar">✎</button>` : ''}</td></tr>`).join('')}</tbody>
          </table></div>` : `<p class="vacio">${esAdmin() ? 'Pulsa «Crear parrillas» para generar un Google Sheet por marca.' : 'Aún no hay parrillas.'}</p>`}
        </section>
        <div class="toolbar">
          <select id="fMarcaC" aria-label="Marca">${opciones(S.cfg.marcas, marca, 'Todas las marcas')}</select>
          ${esGestor() ? '<button class="btn primario" id="bAgendaC">+ Grabación, entregable o fecha</button>' : ''}
        </div>
        <div class="rejilla">
          <section class="card">
            <h3>No ejecutados <span class="cuenta">${atrasados.length}</span></h3>
            <p class="sub">Publicaciones, grabaciones o entregables con fecha pasada que siguen pendientes (últimos 30 días).</p>
            ${atrasados.length ? `<ul class="lista agenda">${atrasados.map(filaAgenda).join('')}</ul>` : '<p class="vacio">Nada atrasado.</p>'}
          </section>
          <section class="card">
            <h3>Próximos 45 días <span class="cuenta">${proximos.length}</span></h3>
            ${proximos.length ? `<ul class="lista agenda">${proximos.map(filaAgenda).join('')}</ul>` : '<p class="vacio">No hay nada agendado.</p>'}
          </section>
        </div>`;

      $('#fMarcaC').onchange = e => { S.marcaContenido = e.target.value; repintar(); };
      if (esGestor()) {
        $('#bParrilla').onclick = () => formParrilla(null);
        $('#bAgendaC').onclick = () => formAgenda(null, S.hoy);
        $('#bSync').onclick = async e => {
          e.target.disabled = true;
          try { await api('sincronizarAhora'); aviso('Parrillas y pauta sincronizadas'); repintar(); }
          catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
        };
      }
      if ($('#bCrearP')) $('#bCrearP').onclick = async e => {
        await confirmar(`Se creará un Google Sheet de parrilla para: ${sinParrilla.join(', ')}. Tarda alrededor de un minuto.`, 'Crear');
        e.target.disabled = true;
        e.target.textContent = 'Creando…';
        try {
          const r = await api('crearParrillas');
          aviso(`Parrillas creadas: ${r.creadas.map(c => c.marca).join(', ')}`);
          repintar();
        } catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
      };
      $('#vista').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.hecho) marcarAgenda(b.dataset.hecho, 'hecho');
        if (b.dataset.ag) formAgenda(agenda.find(a => a.id === b.dataset.ag));
        if (b.dataset.parrilla) formParrilla(parrillas.find(p => p.id === b.dataset.parrilla));
      };
    }
  };

  /** Vista de solo lectura para colaboradores: accesos directos a la parrilla de cada marca. */
  async function pintarParrillasLectura() {
    const parrillas = await api('listarParrillas');
    if (S.vista !== 'contenido') return;
    $('#vista').innerHTML = `
      <p class="sub">Accesos directos a las parrillas de contenido de cada marca. Se abren en Google Sheets.</p>
      <div class="rejilla-parrillas">${parrillas.map(p => `<a class="card parrilla-acceso" href="${esc(p.url)}" target="_blank" rel="noopener">
          <span class="logo">${esc(p.marca.slice(0, 2).toUpperCase())}</span>
          <div><b>${esc(p.marca)}</b><small>${esc(p.nombre)}</small></div><span class="flecha">↗</span></a>`).join('')
        || '<p class="vacio">Aún no hay parrillas.</p>'}</div>`;
  }

  function formParrilla(p) {
    const x = p || {};
    modal(p ? 'Editar parrilla' : 'Vincular parrilla', `
      <div class="dos">
        <label>Marca<select name="marca" required>${opciones(S.cfg.marcas, x.marca, 'Elegir…')}</select></label>
        <label>Nombre<input name="nombre" maxlength="120" required value="${esc(x.nombre)}" placeholder="Ej.: Parrilla 2026"></label>
      </div>
      <label>Enlace del Google Sheet<input name="url" type="url" required value="${esc(x.url)}" placeholder="https://docs.google.com/spreadsheets/d/…"></label>
      <p class="sub">Debe ser un Google Sheet (no .xlsx) con columnas Fecha y Título; la cuenta marketing@hilariogrp.com debe tener acceso.</p>
      ${p ? '<label class="check"><input type="checkbox" name="quitar"> Quitar de la lista</label>' : ''}`,
      async d => {
        if (p) { d.id = p.id; d.activo = d.quitar !== 'on'; }
        await api('guardarParrilla', d);
        aviso('Parrilla guardada y sincronizada');
        repintar();
      });
  }

  /* ---------- Redes sociales: métricas mensuales por cuenta ---------- */

  const METRICAS = [['seguidores', 'Seguidores'], ['alcance', 'Alcance'], ['visualizaciones', 'Visualizaciones'],
    ['interacciones', 'Interacciones'], ['publicaciones', 'Publicaciones']];

  VISTAS.redes = {
    titulo: 'Redes sociales',
    async pintar() {
      if (S.pestanaRedes === 'reporte') return pintarReporteRedes();
      const mes = S.mesRedes || sumarMes(S.hoy.slice(0, 7), -1);
      const d = await api('listarRedes', mes);
      if (S.vista !== 'redes') return;
      const marcas = Array.from(new Set(d.cuentas.map(c => c.marca)));
      const varia = (a, b) => (a === null || a === undefined || !b ? '' : (() => {
        const v = Math.round((a - b) / b * 1000) / 10;
        return `<small class="${v >= 0 ? 'sube' : 'baja'}">${v >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(v), 1)}%</small>`;
      })());
      $('#vista').innerHTML = `
        ${pestanasRedes()}
        <div class="toolbar">
          ${navMes(mes)}
          <div class="controles"><button class="btn" id="bCuentaRed">+ Cuenta</button><button class="btn primario" id="bGuardarRedes">Guardar ${mesTexto(mes)}</button></div>
        </div>
        <p class="sub">Registra las cifras del mes de cada cuenta (las encuentras en Meta Business Suite y TikTok Studio). Los informes calculan el crecimiento y las comparativas por marca.
          Debajo de cada casilla ves la variación contra el mes anterior.</p>
        <form id="fRedes">${marcas.map(m => `<section class="card sin-pad">
          <div class="cab-card pad"><h3>${esc(m)}</h3></div>
          <div class="tabla-caja plana"><table>
            <thead><tr><th>Cuenta</th>${METRICAS.map(([, t]) => `<th class="num">${t}</th>`).join('')}</tr></thead>
            <tbody>${d.cuentas.filter(c => c.marca === m).map(c => `<tr data-cuenta="${esc(c.id)}">
              <td><b>${esc(c.red)}</b><small><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.usuario)} ↗</a></small></td>
              ${METRICAS.map(([k]) => `<td class="num"><input class="num-input" type="number" min="0" step="1" data-k="${k}"
                value="${c.actual && c.actual[k] !== null ? c.actual[k] : ''}" placeholder="${c.anterior && c.anterior[k] !== null ? c.anterior[k] : ''}">
                ${c.actual && c.anterior ? varia(c.actual[k], c.anterior[k]) : ''}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div></section>`).join('')}</form>`;
      enlazarNavMes($('#vista'), mes, m => { S.mesRedes = m; repintar(); });
      enlazarPestanasRedes();
      $('#bGuardarRedes').onclick = async e => {
        const filas = $$('tr[data-cuenta]').map(tr => {
          const o = { cuenta_id: tr.dataset.cuenta };
          $$('input[data-k]', tr).forEach(i => { o[i.dataset.k] = i.value; });
          return o;
        });
        e.target.disabled = true;
        try { await api('guardarRedes', mes, filas); aviso('Métricas guardadas'); repintar(); }
        catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
      };
      $('#bCuentaRed').onclick = () => modal('Agregar cuenta', `
        <div class="dos">
          <label>Marca<select name="marca" required>${opciones(S.cfg.marcas, '', 'Elegir…')}</select></label>
          <label>Red<select name="red">${opciones(['Facebook', 'Instagram', 'TikTok', 'YouTube', 'LinkedIn', 'X'])}</select></label>
        </div>
        <label>Usuario o nombre<input name="usuario" required maxlength="120" placeholder="@cuenta"></label>
        <label>Enlace<input name="url" type="url" maxlength="300"></label>`,
        async x => { await api('guardarCuentaRed', x); aviso('Cuenta agregada'); repintar(); }, 'Agregar');
    }
  };

  /* ---------- Redes: reporte por rango de meses (comparativa, gráficos, exportar) ---------- */

  function pestanasRedes() {
    const p = S.pestanaRedes || 'registro';
    return `<div class="pestanas no-print"><button class="pestana ${p === 'registro' ? 'activo' : ''}" data-pr="registro">Registrar mes</button>
      <button class="pestana ${p === 'reporte' ? 'activo' : ''}" data-pr="reporte">Reporte y comparativa</button></div>`;
  }
  function enlazarPestanasRedes() {
    $$('[data-pr]').forEach(b => { b.onclick = () => { S.pestanaRedes = b.dataset.pr; repintar(); }; });
  }

  let graficosRedes = [];

  async function pintarReporteRedes() {
    graficosRedes.forEach(g => g.destroy());
    graficosRedes = [];
    const hasta = S.hastaRep || sumarMes(S.hoy.slice(0, 7), -1);
    const desde = S.desdeRep || sumarMes(hasta, -3);
    const marca = S.marcaRep || '';
    const d = await api('getReporteRedes', desde, hasta, marca);
    if (S.vista !== 'redes') return;
    const meses = [];
    for (let m = '2026-01'; m <= '2027-12'; m = sumarMes(m, 1)) meses.push([m, mesTexto(m)]);
    const n = v => (v === null || v === undefined ? '—' : fmtNum(v));
    const pct = v => (v === null || v === undefined ? '—' : `<span class="${v >= 0 ? 'sube' : 'baja'}">${v > 0 ? '+' : ''}${fmtNum(v, 1)}%</span>`);
    const tono = { bueno: 'sube', malo: 'baja', neutro: '' };
    const icon = { bueno: '▲', malo: '▼', neutro: '●' };
    const fila = (x, primeras) => `<tr>${primeras}<td class="num">${n(x.seguidoresInicio)}</td><td class="num">${n(x.seguidoresFin)}</td>
      <td class="num">${x.nuevos === null ? '—' : (x.nuevos > 0 ? '+' : '') + fmtNum(x.nuevos)}</td><td class="num">${pct(x.crecimiento)}</td>
      <td class="num">${n(x.alcance)}</td><td class="num">${n(x.visualizaciones)}</td><td class="num">${n(x.interacciones)}</td>
      <td class="num">${n(x.publicaciones)}</td><td class="num">${x.engagement === null ? '—' : fmtNum(x.engagement, 1) + '%'}</td></tr>`;
    const cab = '<th class="num">Seguidores inicio</th><th class="num">Seguidores fin</th><th class="num">Nuevos</th><th class="num">Crecimiento</th>' +
      '<th class="num">Alcance</th><th class="num">Visualizaciones</th><th class="num">Interacciones</th><th class="num">Publicaciones</th><th class="num">Interacción</th>';

    $('#vista').innerHTML = `
      ${pestanasRedes()}
      <div class="toolbar no-print">
        <div class="controles">
          <label class="en-linea">De <select id="rDesde">${opciones(meses, desde)}</select></label>
          <label class="en-linea">a <select id="rHasta">${opciones(meses, hasta)}</select></label>
          <select id="rMarca" aria-label="Marca">${opciones(S.cfg.marcas, marca, 'Todas las marcas')}</select>
        </div>
        <div class="controles">
          <button class="btn" id="bExportarRedes">Exportar a Google Sheets</button>
          <button class="btn primario" id="bImprimirRedes">Imprimir / PDF</button>
        </div>
      </div>
      <header class="cab-informe">
        <div class="marca"><span class="logo">VH</span><div><strong>Reporte de redes sociales · ${mesTexto(d.desde)} a ${mesTexto(d.hasta)}</strong>
          <small>${esc(marca || 'Todas las marcas')} · crecimiento medido contra ${mesTexto(d.base)}</small></div></div>
        <small class="sub">Generado el ${fmtFecha(S.hoy)}</small>
      </header>
      <section class="card"><h3>Lecturas</h3>
        <ul class="lecturas">${d.lecturas.map(l => `<li class="${tono[l.tono]}"><span>${icon[l.tono]}</span>${esc(l.texto)}</li>`).join('') || '<li>Aún no hay datos suficientes en este rango.</li>'}</ul>
      </section>
      <div class="kpis">
        <div class="kpi"><span class="kpi-v">${n(d.total.seguidoresFin)}</span><span class="kpi-k">Seguidores al cierre</span></div>
        <div class="kpi"><span class="kpi-v">${d.total.nuevos === null ? '—' : (d.total.nuevos > 0 ? '+' : '') + fmtNum(d.total.nuevos)}</span><span class="kpi-k">Seguidores nuevos</span>${d.total.crecimiento === null ? '' : `<small>${pct(d.total.crecimiento)}</small>`}</div>
        <div class="kpi"><span class="kpi-v">${n(d.total.alcance)}</span><span class="kpi-k">Alcance</span></div>
        <div class="kpi"><span class="kpi-v">${n(d.total.visualizaciones)}</span><span class="kpi-k">Visualizaciones</span></div>
        <div class="kpi"><span class="kpi-v">${n(d.total.interacciones)}</span><span class="kpi-k">Interacciones</span></div>
        <div class="kpi"><span class="kpi-v">${d.total.engagement === null ? '—' : fmtNum(d.total.engagement, 1) + '%'}</span><span class="kpi-k">Tasa de interacción</span></div>
      </div>
      <div class="rejilla">
        <section class="card span2"><h3>Seguidores por marca, mes a mes</h3><div class="lienzo alto"><canvas id="gRepSeg"></canvas></div></section>
        <section class="card"><h3>Alcance por marca</h3><div class="lienzo"><canvas id="gRepAlc"></canvas></div></section>
        <section class="card"><h3>Crecimiento por red social</h3><div class="lienzo"><canvas id="gRepRed"></canvas></div></section>
      </div>
      <section class="card sin-pad"><div class="cab-card pad"><h3>Por marca</h3></div><div class="tabla-caja plana"><table>
        <thead><tr><th>Marca</th>${cab}</tr></thead>
        <tbody>${d.porMarca.map(x => fila(x, `<td><b>${esc(x.marca)}</b></td>`)).join('')}${fila(d.total, '<td><b>Total</b></td>')}</tbody></table></div></section>
      <section class="card sin-pad"><div class="cab-card pad"><h3>Por cuenta</h3></div><div class="tabla-caja plana"><table>
        <thead><tr><th>Cuenta</th>${cab}</tr></thead>
        <tbody>${d.porCuenta.map(x => fila(x, `<td><b>${esc(x.marca)}</b> · ${esc(x.red)}<small>${esc(x.usuario)}</small></td>`)).join('')}</tbody></table></div></section>
      <section class="card sin-pad"><div class="cab-card pad"><h3>Por red social</h3></div><div class="tabla-caja plana"><table>
        <thead><tr><th>Red</th>${cab}</tr></thead>
        <tbody>${d.porRed.map(x => fila(x, `<td><b>${esc(x.red)}</b></td>`)).join('')}</tbody></table></div></section>
      <section class="card sin-pad"><div class="cab-card pad"><h3>Evolución mensual por marca</h3></div><div class="tabla-caja plana"><table>
        <thead><tr><th>Marca</th><th>Mes</th><th class="num">Seguidores</th><th class="num">Alcance</th><th class="num">Visualizaciones</th><th class="num">Interacciones</th><th class="num">Publicaciones</th></tr></thead>
        <tbody>${d.mensual.map(m => m.meses.map((x, i) => `<tr><td>${i ? '' : '<b>' + esc(m.marca) + '</b>'}</td><td>${mesTexto(x.mes)}</td>
          <td class="num">${n(x.seguidores)}</td><td class="num">${n(x.alcance)}</td><td class="num">${n(x.visualizaciones)}</td>
          <td class="num">${n(x.interacciones)}</td><td class="num">${n(x.publicaciones)}</td></tr>`).join('')).join('')}</tbody></table></div></section>`;

    const crear = (id, config) => {
      const el = document.getElementById(id);
      if (!el || typeof Chart === 'undefined') return;
      config.options = Object.assign({ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }, config.options || {});
      graficosRedes.push(new Chart(el, config));
    };
    const etiquetas = d.meses.map(m => MESES[Number(m.slice(5)) - 1].slice(0, 3) + ' ' + m.slice(2, 4));
    crear('gRepSeg', { type: 'line', data: { labels: etiquetas, datasets: d.mensual.map((m, i) => ({ label: m.marca,
      data: m.meses.map(x => x.seguidores), borderColor: PALETA[i % PALETA.length], backgroundColor: PALETA[i % PALETA.length], tension: .3, spanGaps: true })) } });
    crear('gRepAlc', { type: 'bar', data: { labels: d.porMarca.map(x => x.marca), datasets: [{ label: 'Alcance', data: d.porMarca.map(x => x.alcance), backgroundColor: PALETA[0], borderRadius: 4 }] } });
    crear('gRepRed', { type: 'bar', data: { labels: d.porRed.map(x => x.red), datasets: [{ label: 'Crecimiento %', data: d.porRed.map(x => x.crecimiento), backgroundColor: PALETA[1], borderRadius: 4 }] } });

    enlazarPestanasRedes();
    $('#rDesde').onchange = e => { S.desdeRep = e.target.value; repintar(); };
    $('#rHasta').onchange = e => { S.hastaRep = e.target.value; repintar(); };
    $('#rMarca').onchange = e => { S.marcaRep = e.target.value; repintar(); };
    $('#bImprimirRedes').onclick = () => window.print();
    $('#bExportarRedes').onclick = async e => {
      e.target.disabled = true;
      e.target.textContent = 'Generando…';
      try {
        const r = await api('exportarReporteRedes', desde, hasta, marca);
        modal('Reporte exportado', `<p>Se creó «${esc(r.titulo)}» en tu Drive, carpeta «MarketingVH · Reportes».</p>
          <p><a class="btn primario" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir en Google Sheets ↗</a></p>`, null);
      } catch (err) { aviso(err.message, 'error'); }
      e.target.disabled = false;
      e.target.textContent = 'Exportar a Google Sheets';
    };
  }
</script>
