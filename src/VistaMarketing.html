<script>
  /* ---------- Contenido: parrillas por marca + agenda de publicaciones, grabaciones y entregables ---------- */

  VISTAS.contenido = {
    titulo: 'Contenido y parrillas',
    async pintar() {
      const desde = sumarDias(S.hoy, -30);
      const hasta = sumarDias(S.hoy, 45);
      const [parrillas, agenda] = await Promise.all([api('listarParrillas'), api('listarAgenda', desde, hasta)]);
      if (S.vista !== 'contenido') return;
      const marca = S.marcaContenido || '';
      const deMarca = a => !marca || a.marca === marca;
      const atrasados = agenda.filter(a => a.estado === 'pendiente' && a.fecha < S.hoy && deMarca(a));
      const proximos = agenda.filter(a => a.fecha >= S.hoy && a.estado !== 'cancelado' && deMarca(a));
      const sinParrilla = S.cfg.marcas.filter(m => !parrillas.some(p => p.marca === m && p.nombre.indexOf('PARRILLA ') === 0));
      const filaAgenda = a => `<li class="${a.fecha < S.hoy && a.estado === 'pendiente' ? 'atrasado' : ''}">
        <span class="fecha-chip">${diaSemana(a.fecha)}<b>${a.fecha.slice(8)}</b></span>
        <div><b>${esc(a.titulo)}</b> <span class="etiqueta ${claseAgenda(a.tipo)}">${esc(a.tipo)}</span>
          <small>${[fmtFecha(a.fecha) + (a.hora ? ' ' + a.hora : ''), a.marca, a.red, a.formato, a.pilar, a.responsable].filter(Boolean).map(esc).join(' · ')}</small></div>
        <div class="acciones">
          ${a.estado === 'hecho' ? `<span class="estado e-hecho">${a.parrilla ? 'Publicado' : 'Hecho'}</span>` : ''}
          ${a.estado_material ? `<span class="etiqueta">Diseño: ${esc(a.estado_material)}</span>` : ''}
          ${a.enlace && /^https?:\/\//.test(a.enlace) ? `<a class="btn mini fantasma" href="${esc(a.enlace)}" target="_blank" rel="noopener">Material ↗</a>` : ''}
          ${a.marcable && a.estado === 'pendiente' ? `<button class="btn mini ok" data-hecho="${esc(a.id)}">Hecho</button>` : ''}
          ${a.editable ? `<button class="btn mini fantasma" data-ag="${esc(a.id)}">Editar</button>` : ''}
        </div></li>`;

      $('#vista').innerHTML = `
        <section class="card">
          <div class="cab-card"><h3>Parrillas de contenido</h3>
            <div class="controles">
              ${esGestor() ? '<button class="btn mini" id="bSync">↻ Sincronizar ahora</button><button class="btn mini" id="bParrilla">+ Vincular otra</button>' : ''}
              ${esAdmin() && sinParrilla.length ? `<button class="btn mini primario" id="bCrearP">Crear parrillas (${sinParrilla.length})</button>` : ''}
            </div></div>
          <p class="sub">Cada marca tiene su Google Sheet con una pestaña por mes. Lo que se llena ahí aparece solo en el calendario (se sincroniza cada hora).
            Para que cuente como publicado, marca el <b>Estado</b> como «Publicado».</p>
          ${parrillas.length ? `<div class="tabla-caja plana"><table>
            <thead><tr><th>Marca</th><th>Parrilla</th><th>Última sincronización</th><th></th></tr></thead>
            <tbody>${parrillas.map(p => `<tr><td><b>${esc(p.marca)}</b></td>
              <td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.nombre)} ↗</a></td>
              <td>${p.ultima_sync ? fmtFecha(p.ultima_sync) + ' ' + esc(p.ultima_sync.slice(11, 16)) : '—'}
                <small class="${String(p.estado_sync).indexOf('Error') === 0 ? 'alerta' : ''}">${esc(p.estado_sync)}</small></td>
              <td>${esGestor() ? `<button class="btn-ico" data-parrilla="${esc(p.id)}" aria-label="Editar">✎</button>` : ''}</td></tr>`).join('')}</tbody>
          </table></div>` : `<p class="vacio">${esAdmin() ? 'Pulsa «Crear parrillas» para generar un Google Sheet por marca.' : 'Aún no hay parrillas.'}</p>`}
        </section>
        <div class="toolbar">
          <select id="fMarcaC" aria-label="Marca">${opciones(S.cfg.marcas, marca, 'Todas las marcas')}</select>
          ${esGestor() ? '<button class="btn primario" id="bAgendaC">+ Grabación, entregable o fecha</button>' : ''}
        </div>
        <div class="rejilla">
          <section class="card">
            <h3>No ejecutados <span class="cuenta">${atrasados.length}</span></h3>
            <p class="sub">Publicaciones, grabaciones o entregables con fecha pasada que siguen pendientes (últimos 30 días).</p>
            ${atrasados.length ? `<ul class="lista agenda">${atrasados.map(filaAgenda).join('')}</ul>` : '<p class="vacio">Nada atrasado.</p>'}
          </section>
          <section class="card">
            <h3>Próximos 45 días <span class="cuenta">${proximos.length}</span></h3>
            ${proximos.length ? `<ul class="lista agenda">${proximos.map(filaAgenda).join('')}</ul>` : '<p class="vacio">No hay nada agendado.</p>'}
          </section>
        </div>`;

      $('#fMarcaC').onchange = e => { S.marcaContenido = e.target.value; repintar(); };
      if (esGestor()) {
        $('#bParrilla').onclick = () => formParrilla(null);
        $('#bAgendaC').onclick = () => formAgenda(null, S.hoy);
        $('#bSync').onclick = async e => {
          e.target.disabled = true;
          try { await api('sincronizarAhora'); aviso('Parrillas y pauta sincronizadas'); repintar(); }
          catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
        };
      }
      if ($('#bCrearP')) $('#bCrearP').onclick = async e => {
        await confirmar(`Se creará un Google Sheet de parrilla para: ${sinParrilla.join(', ')}. Tarda alrededor de un minuto.`, 'Crear');
        e.target.disabled = true;
        e.target.textContent = 'Creando…';
        try {
          const r = await api('crearParrillas');
          aviso(`Parrillas creadas: ${r.creadas.map(c => c.marca).join(', ')}`);
          repintar();
        } catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
      };
      $('#vista').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.hecho) marcarAgenda(b.dataset.hecho, 'hecho');
        if (b.dataset.ag) formAgenda(agenda.find(a => a.id === b.dataset.ag));
        if (b.dataset.parrilla) formParrilla(parrillas.find(p => p.id === b.dataset.parrilla));
      };
    }
  };

  function formParrilla(p) {
    const x = p || {};
    modal(p ? 'Editar parrilla' : 'Vincular parrilla', `
      <div class="dos">
        <label>Marca<select name="marca" required>${opciones(S.cfg.marcas, x.marca, 'Elegir…')}</select></label>
        <label>Nombre<input name="nombre" maxlength="120" required value="${esc(x.nombre)}" placeholder="Ej.: Parrilla 2026"></label>
      </div>
      <label>Enlace del Google Sheet<input name="url" type="url" required value="${esc(x.url)}" placeholder="https://docs.google.com/spreadsheets/d/…"></label>
      <p class="sub">Debe ser un Google Sheet (no .xlsx) con columnas Fecha y Título; la cuenta marketing@hilariogrp.com debe tener acceso.</p>
      ${p ? '<label class="check"><input type="checkbox" name="quitar"> Quitar de la lista</label>' : ''}`,
      async d => {
        if (p) { d.id = p.id; d.activo = d.quitar !== 'on'; }
        await api('guardarParrilla', d);
        aviso('Parrilla guardada y sincronizada');
        repintar();
      });
  }

  /* ---------- Redes sociales: métricas mensuales por cuenta ---------- */

  const METRICAS = [['seguidores', 'Seguidores'], ['alcance', 'Alcance'], ['visualizaciones', 'Visualizaciones'],
    ['interacciones', 'Interacciones'], ['publicaciones', 'Publicaciones']];

  VISTAS.redes = {
    titulo: 'Redes sociales',
    async pintar() {
      const mes = S.mesRedes || sumarMes(S.hoy.slice(0, 7), -1);
      const d = await api('listarRedes', mes);
      if (S.vista !== 'redes') return;
      const marcas = Array.from(new Set(d.cuentas.map(c => c.marca)));
      const varia = (a, b) => (a === null || a === undefined || !b ? '' : (() => {
        const v = Math.round((a - b) / b * 1000) / 10;
        return `<small class="${v >= 0 ? 'sube' : 'baja'}">${v >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(v), 1)}%</small>`;
      })());
      $('#vista').innerHTML = `
        <div class="toolbar">
          ${navMes(mes)}
          <div class="controles"><button class="btn" id="bCuentaRed">+ Cuenta</button><button class="btn primario" id="bGuardarRedes">Guardar ${mesTexto(mes)}</button></div>
        </div>
        <p class="sub">Registra las cifras del mes de cada cuenta (las encuentras en Meta Business Suite y TikTok Studio). Los informes calculan el crecimiento y las comparativas por marca.
          Debajo de cada casilla ves la variación contra el mes anterior.</p>
        <form id="fRedes">${marcas.map(m => `<section class="card sin-pad">
          <div class="cab-card pad"><h3>${esc(m)}</h3></div>
          <div class="tabla-caja plana"><table>
            <thead><tr><th>Cuenta</th>${METRICAS.map(([, t]) => `<th class="num">${t}</th>`).join('')}</tr></thead>
            <tbody>${d.cuentas.filter(c => c.marca === m).map(c => `<tr data-cuenta="${esc(c.id)}">
              <td><b>${esc(c.red)}</b><small><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.usuario)} ↗</a></small></td>
              ${METRICAS.map(([k]) => `<td class="num"><input class="num-input" type="number" min="0" step="1" data-k="${k}"
                value="${c.actual && c.actual[k] !== null ? c.actual[k] : ''}" placeholder="${c.anterior && c.anterior[k] !== null ? c.anterior[k] : ''}">
                ${c.actual && c.anterior ? varia(c.actual[k], c.anterior[k]) : ''}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div></section>`).join('')}</form>`;
      enlazarNavMes($('#vista'), mes, m => { S.mesRedes = m; repintar(); });
      $('#bGuardarRedes').onclick = async e => {
        const filas = $$('tr[data-cuenta]').map(tr => {
          const o = { cuenta_id: tr.dataset.cuenta };
          $$('input[data-k]', tr).forEach(i => { o[i.dataset.k] = i.value; });
          return o;
        });
        e.target.disabled = true;
        try { await api('guardarRedes', mes, filas); aviso('Métricas guardadas'); repintar(); }
        catch (err) { aviso(err.message, 'error'); e.target.disabled = false; }
      };
      $('#bCuentaRed').onclick = () => modal('Agregar cuenta', `
        <div class="dos">
          <label>Marca<select name="marca" required>${opciones(S.cfg.marcas, '', 'Elegir…')}</select></label>
          <label>Red<select name="red">${opciones(['Facebook', 'Instagram', 'TikTok', 'YouTube', 'LinkedIn', 'X'])}</select></label>
        </div>
        <label>Usuario o nombre<input name="usuario" required maxlength="120" placeholder="@cuenta"></label>
        <label>Enlace<input name="url" type="url" maxlength="300"></label>`,
        async x => { await api('guardarCuentaRed', x); aviso('Cuenta agregada'); repintar(); }, 'Agregar');
    }
  };
</script>
